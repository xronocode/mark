# FILE: .github/workflows/site.yml
# VERSION: 2.1.0
# START_MODULE_CONTRACT
#   PURPOSE: Site publish pipeline — build the VitePress site (landing is
#            emitted by the config's buildEnd hook), gate it with the dist
#            checker, and deploy to GitHub Pages.
#   SCOPE: PRs build + check only; main pushes and manual runs also deploy.
#          No release artifacts, no app code.
#   DEPENDS: Node 22, site/package.json (vitepress), site/scripts/check-dist.mjs.
#   LINKS: M-053 SiteBuild; C-22 (supersedes the C-14 cp overlay).
#   ROLE: CONFIG
#   MAP_MODE: SUMMARY
# END_MODULE_CONTRACT
#
# START_MODULE_MAP
#   build - npm ci, vitepress build, dist check, Pages artifact upload.
#   deploy - Pages deploy (main / workflow_dispatch only).
# END_MODULE_MAP
#
# START_CHANGE_SUMMARY
#   LAST_CHANGE: [v2.0.0 - C-22: single build command, dist gate, PR checks,
#                 env-driven SITE_URL/SITE_BASE/UMAMI_WEBSITE_ID via repo vars]
# END_CHANGE_SUMMARY
#
# Deployment settings come from repository variables (Settings → Variables):
#   SITE_URL          public root, incl. base path  (default https://mark.xronocode.com)
#   SITE_BASE         URL base path                  (default /)
#   UMAMI_WEBSITE_ID  enables cookieless Umami        (unset = no analytics)
#   GA_MEASUREMENT_ID enables Google Analytics 4      (G-XXXX; wins over Umami)
# Until the custom domain is live on Pages, set SITE_URL=https://xronocode.github.io/mark
# and SITE_BASE=/mark/ to keep the github.io address working.

name: site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_BASE: ${{ vars.SITE_BASE }}
      UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
      GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run check

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
