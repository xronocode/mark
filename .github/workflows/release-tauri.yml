# FILE: .github/workflows/release-tauri.yml
# VERSION: 1.2.0
# START_MODULE_CONTRACT
#   PURPOSE: Build and smoke-test unsigned macOS candidate bundles without exposing production signing credentials.
#   SCOPE: Path-filtered PR/tauri-branch builds, updater-disabled Tauri packaging, ad-hoc app signing, installed-app smoke, size evidence, warning checks, exact cleanup and retained metadata.
#   DEPENDS: Node 22, Rust 1.99.0, Tauri CLI/action, macos-15, M-046 release configuration.
#   LINKS: .grace/graph/features.xml M-046; .grace/verification/features.xml V-M-046.
#   ROLE: CONFIG
#   MAP_MODE: SUMMARY
# END_MODULE_CONTRACT
#
# START_MODULE_MAP
#   build - Produce an unsigned, updater-disabled .app/DMG candidate and verify its ad-hoc signed install path without release secrets.
# END_MODULE_MAP
#
# START_CHANGE_SUMMARY
#   - 2026-11-15 C-QA-INSTALLER-ARTIFACTS: bind smoke to a unique app/run, normal Quit and remove all completed binary copies.
#   LAST_CHANGE: 2026-11-09 v1.2.0 C-CI-CD-AUDIT-FIXES - pin executable actions and Rust 1.99.0 with a version-sensitive cache.
#   PREV: 2026-10-31 v1.1.0 - build the macOS dry-run lane on the macos-15 runner image ahead of the macos-14 retirement (matrix os and the platform conditions).
#   PREV: 2026-10-21 v1.0.0 - disable updater artifact signing in the unprivileged dry-run while retaining .app/DMG packaging and smoke coverage.
# END_CHANGE_SUMMARY
#
# Phase-B1.5 dry-run workflow retained as the unprivileged candidate bundle
# check alongside the separate tag-triggered production release workflow.
#
# Triggered by pushes to `tauri`, pull requests to `main` or `tauri`, and
# explicit workflow dispatch. It never handles release tags or secrets.
#
# Path filter keeps the runner idle on doc-only commits. concurrency
# cancel-in-progress=true means a follow-up push supersedes the in-flight
# build (we don't burn macOS-14 minutes on stale commits).
#
# Per Phase-B1.5 step-3: failure does NOT block PR merge unless the PR
# carries the `phase=B1.5-gate` label. Implementation: continue-on-error
# is gated by label presence so PRs without the label show yellow
# warnings; PRs WITH the label show red blocking failures.

name: tauri-release-dryrun

on:
  push:
    branches: [tauri]
    paths:
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.js'
      - 'tools/**'
      - '.github/workflows/release-tauri.yml'
      - 'docs/ci-warnings-allowlist.md'
  pull_request:
    branches: [main, tauri]
    paths:
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.js'
      - 'tools/**'
      - '.github/workflows/release-tauri.yml'
      - 'docs/ci-warnings-allowlist.md'
  workflow_dispatch:

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    # Phase-B1.5 step-3: failures are non-blocking unless gate label set.
    # contains() returns false on push events (no PR labels) so push-
    # triggered runs are always non-blocking — that's the dry-run posture.
    continue-on-error: ${{ !contains(github.event.pull_request.labels.*.name, 'phase=B1.5-gate') }}

    steps:
      # ── checkout + tooling ────────────────────────────────────────
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: setup rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.platform.target }}

      - name: cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-workspace-v1-${{ matrix.platform.target }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            cargo-workspace-v1-${{ matrix.platform.target }}-

      # ── install + build frontend ─────────────────────────────────
      - name: npm ci
        run: npm ci

      - name: vite build
        run: npm run build

      - name: prepare isolated QA identity
        id: qa
        env:
          QA_SOURCE_SHA: ${{ github.sha }}
          QA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QA_RUN_ID: ${{ github.run_id }}
          QA_RUN_ATTEMPT: ${{ github.run_attempt }}
          QA_PLATFORM: ${{ matrix.platform.name }}
          QA_MODE: dryrun
        run: node tools/prepare-qa-artifacts.mjs prepare

      # ── tauri build (unsigned) ───────────────────────────────────
      # tauri-action handles cargo build --release + bundle generation.
      # We do NOT pass code-signing inputs — the post-build step uses
      # ad-hoc codesign instead per Phase-B1.5 step-5.
      - name: tauri build
        id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          # The production config requests signed updater archives. This
          # unprivileged check disables updater signing and isolates the app
          # identity while retaining .app/DMG and every later dry-run gate.
          args: >-
            --target ${{ matrix.platform.target }}
            --config '${{ steps.qa.outputs.config }}'

      # ── ad-hoc signing and installed-app smoke ──────────────────
      # The helper signs/verifies, mounts readonly, installs under an exclusive
      # run identity, opens via LaunchServices and checks the exact process.
      # Its finally block requests normal Quit, verifies process/window exit,
      # and removes completed app, installer and standalone binary copies.
      - name: smoke launch
        if: matrix.platform.os == 'macos-15'
        id: smoke
        env:
          QA_STATE: ${{ steps.qa.outputs.state }}
        run: node tools/qa-artifact-smoke.mjs --state "$QA_STATE"

      # ── bundle size measurement (Phase-B1.5 step-7) ──────────────
      - name: bundle size
        if: matrix.platform.os == 'macos-15'
        id: size
        env:
          QA_BUNDLE_BYTES: ${{ steps.smoke.outputs.bundle_bytes }}
          QA_BUNDLE_HUMAN: ${{ steps.smoke.outputs.bundle_human }}
        run: |
          set -euo pipefail
          BYTES="$QA_BUNDLE_BYTES"
          HUMAN="$QA_BUNDLE_HUMAN"
          echo "bundle_bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "bundle_human=$HUMAN" >> "$GITHUB_OUTPUT"
          {
            echo "## Bundle size — ${{ matrix.platform.name }}"
            echo
            echo "- \`du -sh\`: **$HUMAN**"
            echo "- bytes: $BYTES"
            echo "- target: < 30 MB (~31457280 bytes) per Phase-B1.5 step-7 budget"
            if [ "$BYTES" -lt 31457280 ]; then
              echo "- status: ✅ within budget"
            else
              echo "- status: ⚠️ over budget — reconcile per C2-9 (raise + document, or trim)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ── warnings allowlist (Phase-B1.5 step-8) ───────────────────
      # cargo build --release output is captured during tauri-action.
      # Re-run with --message-format=json to capture warnings cleanly,
      # then diff against the allowlist. New unlisted warnings fail the
      # allowlist check; expected warnings pass through.
      - name: warnings allowlist check
        if: matrix.platform.os == 'macos-15'
        run: |
          set -euo pipefail
          cd src-tauri
          cargo build --release --bin mark --message-format=json > /tmp/cargo.json
          cd ..
          node tools/check-warnings-allowlist.mjs /tmp/cargo.json docs/ci-warnings-allowlist.md \
            > /tmp/toolchain-warnings.json
          cat /tmp/toolchain-warnings.json

      - name: remove local QA binaries
        if: always() && steps.qa.outputs.state != ''
        env:
          QA_STATE: ${{ steps.qa.outputs.state }}
        run: node tools/prepare-qa-artifacts.mjs cleanup --state "$QA_STATE"

      # Generic dry-runs complete their test here. Retain evidence, not installers.
      - name: upload QA lifecycle evidence
        if: always() && steps.qa.outputs.state != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.qa.outputs.artifact_name }}-evidence
          path: ${{ steps.qa.outputs.evidence }}
          if-no-files-found: error
          retention-days: 14

      - name: upload toolchain warnings json
        if: matrix.platform.os == 'macos-15' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: toolchain-warnings-${{ matrix.platform.name }}
          path: /tmp/toolchain-warnings.json
          if-no-files-found: warn
          retention-days: 14
