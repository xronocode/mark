# FILE: .github/workflows/release-governance.yml
# VERSION: 1.4.0
# START_MODULE_CONTRACT
#   PURPOSE: Expose the stable release/governance and docs-security required checks for ordinary pull requests and main without demanding a frozen release train.
#   SCOPE: Read-only Conventional title/admission, repository governance, schema, focused regression validation and the committed-range leak scan; an optional push-main job uses one dedicated secret to reconcile the non-authoritative public Project mirror.
#   DEPENDS: M-046 release-governance, bounded action-reference and Project-sync tools; tools/security_gate.py scan-diff with the Gitleaks binary; Node 22; locked npm dependencies; PROJECT_MIRROR_AUTH for the optional push-main mirror only.
#   LINKS: .grace/graph/features.xml M-046; .grace/verification/features.xml V-M-046.
#   ROLE: CONFIG
#   MAP_MODE: SUMMARY
# END_MODULE_CONTRACT
#
# START_MODULE_MAP
#   governance - Read-only stable aggregate check used by the main ruleset.
#   readiness - Repository-only train/material identity check recorded on each candidate payload for later strict tag admission.
#   docs-security - Always-on committed-range leak scan (security_gate.py scan-diff) over the pull-request diff — the same deterministic rules as the local gate, so docs-only lanes keep leak protection.
#   project-mirror - Non-required push-main reconciliation isolated to its dedicated Project token.
# END_MODULE_MAP
#
# START_CHANGE_SUMMARY
#   - 2026-11-12 C-RELEASE-ACTION-REFERENCES: verify privileged action commits and metadata using the existing read-only governance token.
#   - 2026-11-09 v1.4.0: add the always-on docs-security job (owner instruction) — tools/security_gate.py scan-diff over origin/main..HEAD with a pinned Gitleaks binary, applying the local gate's exposure and secret rules to every pull-request diff so the docs-only CI lane cannot bypass leak review.
#   - 2026-10-20 v1.3.0: fetch full history for the governance job so the release-boundary normalization regression can inspect its pinned bootstrap commit in CI.
#   - 2026-10-20 v1.2.0: state the optional Project mirror's dedicated-secret boundary explicitly instead of describing the whole workflow as token-free.
#   - 2026-10-20 v1.1.0: record a repository-only release/readiness check on candidate payload commits and cover the public Project mirror.
#   - 2026-10-20 v1.0.0: add the stable ordinary-PR governance check distinct from strict release readiness.
# END_CHANGE_SUMMARY

name: release/governance

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: release-governance-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  docs-security:
    name: docs-security
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: fetch base main
        run: git fetch --no-tags origin main

      - name: install pinned Gitleaks
        run: |
          set -euo pipefail
          # Pinned to the owner's local gate version so CI and the local gate
          # apply the same rule set; bump together with the local install.
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: committed-range exposure and secret scan
        run: python3 tools/security_gate.py scan-diff origin/main

  governance:
    name: release/governance
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: install locked dependencies
        run: npm ci --ignore-scripts

      - name: validate ordinary governance
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: npm run release:governance

      - name: validate immutable action references and metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/action-ref-check.mjs

      - name: focused governance regressions
        run: >-
          npx vitest run
          tests/renderer/release-governance.test.js
          tests/renderer/action-ref-check.test.js
          tests/renderer/release-github-controls.test.js
          tests/renderer/release-project-sync.test.js
          tests/renderer/release-normalize.test.js
          tests/renderer/release-train.test.js
          tests/renderer/release-readiness.test.js
          tests/renderer/release-materials.test.js
          tests/renderer/release-notes.test.js

  readiness:
    name: release/readiness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: install locked dependencies
        run: npm ci --ignore-scripts

      - name: validate repository release evidence
        run: |
          TAG=v$(node tools/release-train.mjs --field computedVersion)
          npm run release:readiness -- --tag "$TAG"
          # Materials admission is release-candidate evidence: a
          # Collecting train has no candidate, and the README honestly
          # still names the previous released version. Frozen and Ready
          # seals must carry exact materials for the computed version.
          STATE=$(node tools/release-train.mjs --field state)
          case "$STATE" in
            Frozen|Ready|Released) npm run release:materials -- --tag "$TAG" ;;
            *) echo "state=$STATE — materials admission deferred" ;;
          esac

  project-mirror:
    name: release/project-mirror
    needs: governance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: install locked dependencies
        run: npm ci --ignore-scripts

      - name: reconcile non-authoritative Project mirror
        env:
          PROJECT_MIRROR_AUTH: ${{ secrets.PROJECT_MIRROR_AUTH }}
        run: npm run release:project-sync -- --apply
