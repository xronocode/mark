# FILE: .github/workflows/test.yml
# VERSION: 1.10.0
# START_MODULE_CONTRACT
#   PURPOSE: Run renderer/backend unit tests and browser regressions before integration.
#   SCOPE: Push/PR/manual test jobs, browser installation and aggregate status; no release publication.
#   DEPENDS: npm scripts, Cargo workspace, playwright.config.ts, GitHub Actions runners.
#   LINKS: .grace/graph/features.xml M-046; .grace/verification/features.xml V-M-046; .grace/changes/archive/C-63.
#   ROLE: CONFIG
#   MAP_MODE: NONE
# END_MODULE_CONTRACT
# START_MODULE_MAP
# END_MODULE_MAP
# START_CHANGE_SUMMARY
#   LAST_CHANGE: 2026-11-12 C-QUICKLOOK-CONTENT-BOUNDARY: gate the actual native preview and isolated unsigned extension build through the required status aggregate.
#   SECURITY: 2026-11-11 C-SEC-STREAM-TABS/C-SEC-GATEWAY-TOOLS: require stream-ownership WebKit regressions and prepare the credential-free nested toolchain from its lockfile.
#   CURRENT: 2026-11-10 C-HOSTED-VALIDATION-RECOVERY: replace the stalled Azure HTTP Ubuntu source URI with canonical HTTPS on the ephemeral Linux runner; retain signed suites, package lists, retry counts and budgets.
#   LAST_CHANGE: v1.9.0 - 2026-11-09 C-CI-CD-AUDIT-FIXES: repair docs-only classification, gate IPC types in renderer-unit, pin executable actions and Rust 1.99.0, and run each WebKit theme/tree project once.
#   PREV: v1.8.0 - 2026-11-09: the docs-only lane (owner instruction) — pull requests whose diff is confined to docs/**, .grace/changes/** and top-level *.md skip renderer-unit/backend-unit/renderer-e2e (job-level skips satisfy the strict ruleset); status-check aggregates the skipped lane green; push events always run the full suite.
#   PREV: v1.7.0 - 2026-10-30: the tech-debt lane (integ/techdebt) runs the full suite on push and on pull requests into it, so lane admissions carry the same evidence as main.
#   PREV: v1.6.0 - 2026-10-31: move every macOS lane to the macos-15 runner image ahead of the macos-14 retirement (matrix jobs, e2e job name and Playwright cache keys).
#   PREV: v1.5.0 - 2026-10-27: bound, IPv4-pinned and retried the Linux Tauri sysdeps install so a stalled apt fetch fails fast inside the job budget instead of cancelling the run and blocking the aggregate status check.
#   PREV: v1.4.0 - 2026-10-20: fetch full history for renderer-unit so release-boundary normalization tests can inspect their pinned bootstrap commit.
#   PREV: v1.3.0 - 2026-10-19: gate session restore and close/edit ownership in WebKit.
#   PREV: v1.2.0 - 2026-10-19: gate opened-baseline priority and calm diff exits in WebKit.
#   PREV: v1.1.0 - 2026-10-19: gate native vertical selection with the passive format toolbar in WebKit.
#   PREV: v1.0.0 - 2026-10-18 C-63: enforce C-60/C-62 WebKit projects after browser installation.
# END_CHANGE_SUMMARY
#
# Phase-7 polish-plan test workflow.
#
# Runs the full validation surface produced by polish phases 3–6:
#   - renderer-unit:        vitest (310 tests)        — Phase 4
#   - backend-unit:         cargo test --bin mark     — Phase 5 (392 tests)
#   - renderer-e2e:         playwright chromium       — full renderer e2e suite
#                           + playwright webkit-perf  — C-30 large-document gate in
#                             WebKit, the engine WKWebView ships (C-31)
#
# Triggers: push to main, PR targeting main, manual dispatch. Existing
# release.yml + release-tauri.yml are tag/branch-scoped respectively
# and untouched by this file.
#
# Notes on tooling versions:
#   - Node 22 + Rust 1.99.0 mirror release.yml so a
#     green test run is a reliable predictor of a green release build.
#   - cargo test uses --bin mark because src-tauri/Cargo.toml has no
#     [lib] target — all 392 unit tests are attached to the binary.
#   - Linux Tauri sysdeps (webkit2gtk-4.1, gtk-3, soup-3) are not
#     strictly required for `cargo test --bin mark` because the test
#     suite does not link the windowing layer, BUT tauri-build runs at
#     compile time and pulls webkit pkg-config probes — installing the
#     deps avoids spurious failures and keeps parity with future jobs.
#   - Playwright runs macos-15 only initially; Linux is added under the
#     same matrix entry once it has been observed green at least once.

name: test

on:
  push:
    branches: [main, integ/techdebt]
  pull_request:
    branches: [main, integ/techdebt]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: change classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.filter.outputs.non_docs == 'false' }}
    steps:
      - name: checkout for change classification
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: docs-only lane filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            non_docs:
              - '**'
              - '!docs/**'
              - '!.grace/changes/**'
              - '!*.md'

  renderer-unit:
    name: renderer unit (${{ matrix.os }})
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        # C-15 T-W3: windows-latest joined as a blocking lane — the
        # renderer platform shim is build-host-dependent now.
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: npm ci
        run: npm ci

      - name: prepare locked gateway tools without credentials
        working-directory: tools/stats-gateway
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: verify IPC types
        run: npm run typecheck:ipc

      - name: vitest run with coverage
        run: npm run test:coverage

  backend-unit:
    name: backend unit (${{ matrix.os }})
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        # C-15 T-W3: windows-latest is the Windows-cfg compile gate
        # (cross-check from macOS is blocked by ring's MSVC toolchain
        # needs — see C-15 plan T-W2 verification note).
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: setup rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.0'

      - name: cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-test-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            cargo-test-${{ matrix.os }}-

      # The hosted Ubuntu image occasionally blackholes IPv6 and stalls the
      # apt fetch. Unbounded, that consumed the whole 30-minute job budget and
      # left the aggregate "status check" unfinished, so main could not go
      # green and no pull request could satisfy the required checks. Prefer
      # IPv4, bound every fetch, retry, and fail this step fast instead.
      - name: install tauri sysdeps (linux)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # Some image sources use an Azure HTTP mirror that can stall while
          # canonical Ubuntu HTTPS downloads succeed. Preserve every suite,
          # component and signing key; change only that known source URI.
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            [ -f "$apt_source" ] || continue
            sudo sed -E -i 's@http://azure[.]archive[.]ubuntu[.]com/ubuntu([/[:space:]]|$)@https://archive.ubuntu.com/ubuntu\1@g' "$apt_source"
          done
          apt_opts=(
            -o Acquire::ForceIPv4=true
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          updated=0
          for attempt in 1 2; do
            if sudo timeout -k 10 180 apt-get update "${apt_opts[@]}"; then
              updated=1
              break
            fi
            echo "::warning::apt-get update attempt ${attempt} failed; retrying"
            sleep 10
          done
          if [ "$updated" != 1 ]; then
            echo "::error::apt-get update failed after 2 attempts"
            exit 1
          fi
          for attempt in 1 2 3; do
            if sudo timeout -k 10 300 apt-get install -y --no-install-recommends "${apt_opts[@]}" \
              libwebkit2gtk-4.1-dev \
              libgtk-3-dev \
              libsoup-3.0-dev \
              libjavascriptcoregtk-4.1-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev; then
              exit 0
            fi
            echo "::warning::tauri sysdeps install attempt ${attempt} failed; retrying"
            sudo dpkg --configure -a || true
            sleep 10
          done
          echo "::error::tauri sysdeps install failed after 3 attempts"
          exit 1

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --bin mark

  renderer-e2e:
    name: renderer e2e playwright (macos-15)
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    runs-on: macos-15
    # C-LARGE-DOC-STAGE-0: raised from 25 — the webkit-perf characterization
    # oracles add ~5 minutes of WebKit suites; the first full green run took
    # 25m14s and merge-commit runs (one flake retry) tipped over the old
    # ceiling and were cancelled. Gate budgets and assertions are unchanged.
    # C-LARGE-DOC-WAVE-A follow-up (2026-11-02): 35 -> 45 — the Wave A
    # progressive/failsafe webkit-perf suites plus capacity-slowed macOS
    # queueing pushed merge-commit runs past 35m again (the vite-8 bump
    # PR's rerun died on the ceiling with zero failing tests). Operational
    # headroom only; no gate, budget or assertion is weakened.
    timeout-minutes: 45

    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: npm ci
        run: npm ci

      - name: vite build
        run: npm run build

      - name: cache playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-macos-15-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-macos-15-

      - name: install playwright chromium
        run: npx playwright install chromium --with-deps

      - name: playwright test
        run: npm run test:e2e

      # C-31: the C-30 WebKit perf gate (500-section document, main-thread
      # busy < 3 s). Reuses the vite build above; `npm run test:e2e:perf`
      # would rebuild, so the project is invoked directly.
      - name: install playwright webkit
        run: npx playwright install webkit --with-deps

      # C-63: retain WKWebView-engine coverage for the C-60/C-62 fixes.
      - name: webkit footnote preferences, diagram appearance, keyboard selection, diff baselines and sessions
        run: npx playwright test --project webkit-footnotes --project webkit-diagram-appearance --project webkit-keyboard --project webkit-diff --project webkit-session --project webkit-live-stream

      - name: webkit large-document perf gate
        run: npx playwright test --project webkit-perf

      # C-38 T-003: the Settings shell in WebKit (the engine the macOS build
      # ships) — tabs, per-OS layout, no overflow at 640 px.
      # C-51 T-009: the rich-Markdown honesty guard also gates in WebKit.
      # C-51 T-005: the content theming (Vega-Lite/flowchart/sequence/KaTeX)
      # also gates in WebKit; C-51 T-006 adds the expand button + block viewer.
      - name: webkit settings, title bar, outline rail, status bar, lock, chrome theme, Mica, tables, rich Markdown, content theming and block viewer and theme families
        run: npx playwright test --project webkit-settings --project webkit-titlebar --project webkit-outline --project webkit-statusbar --project webkit-chrome --project webkit-mica --project webkit-tables --project webkit-menu-checks --project webkit-rich --project webkit-content-theme --project webkit-block-viewer --project webkit-theme-families --project webkit-clipboard

      # C-55 (port of C-51 T-003/T-004): the pele theme matrix also runs
      # in WebKit (22 diagram types × light/dark + theme switch); its
      # per-type screenshots are the visual evidence for the lab look.
      - name: webkit pele theme matrix
        run: npx playwright test --project webkit-pele-theme --project webkit-tree

      - name: upload pele theme screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pele-theme-screenshots
          path: test-results/pele-themes/
          retention-days: 14

      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  quicklook-native:
    name: QuickLook native boundary (macos-15)
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    runs-on: macos-15
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: verify actual native preview boundary
        run: node tools/check-quicklook.mjs
      - name: build isolated unsigned preview extension
        # The autogenerated scheme also builds/registers its host on a clean tree.
        # Select the extension target explicitly and isolate both output roots.
        run: >-
          xcodebuild -project mark-quicklook/MarkQuickLook.xcodeproj -target MarkPreview
          -configuration Debug
          SYMROOT="$PWD/.claude/quicklook-content-boundary/target-build/products"
          OBJROOT="$PWD/.claude/quicklook-content-boundary/target-build/intermediates"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=
          REGISTER_APP_WITH_LAUNCH_SERVICES=NO SKIP_INSTALL=YES build

  status-check:
    name: status check
    needs: [changes, renderer-unit, backend-unit, renderer-e2e, quicklook-native]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: aggregate
        run: |
          set -euo pipefail
          echo "docs_only:     ${{ needs.changes.outputs.docs_only }}"
          echo "renderer-unit: ${{ needs.renderer-unit.result }}"
          echo "backend-unit:  ${{ needs.backend-unit.result }}"
          echo "renderer-e2e:  ${{ needs.renderer-e2e.result }}"
          echo "quicklook-native: ${{ needs.quicklook-native.result }}"
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.changes.outputs.docs_only }}" = "true" ]; then
            for r in "${{ needs.renderer-unit.result }}" "${{ needs.backend-unit.result }}" "${{ needs.renderer-e2e.result }}" "${{ needs.quicklook-native.result }}"; do
              if [ "$r" != "skipped" ] && [ "$r" != "success" ]; then
                echo "::error::docs-only lane: expected the heavy jobs to be skipped or green, got '$r'"
                exit 1
              fi
            done
            echo "docs-only lane: heavy jobs skipped, aggregate green"
            exit 0
          fi
          if [ "${{ needs.renderer-unit.result }}" != "success" ] \
             || [ "${{ needs.backend-unit.result }}" != "success" ] \
             || [ "${{ needs.renderer-e2e.result }}" != "success" ] \
             || [ "${{ needs.quicklook-native.result }}" != "success" ]; then
            echo "::error::one or more test jobs failed"
            exit 1
          fi
          echo "all green"
