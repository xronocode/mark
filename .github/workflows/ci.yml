# FILE: .github/workflows/ci.yml
# START_MODULE_CONTRACT
#   PURPOSE: Keep full workspace Cargo and fixture validation as blocking CI gates.
#   SCOPE: Existing docs classification and test job; record/reap/delete exact test executables before cache save.
#   DEPENDS: Cargo workspace, Node22 lifecycle helper, GitHub Actions runners.
#   LINKS: M-046; V-M-046; C-CI-RUST-TEST-ARTIFACT-LIFECYCLE-EXECVE.
#   ROLE: CONFIG
#   MAP_MODE: NONE
# END_MODULE_CONTRACT
# START_MODULE_MAP
# END_MODULE_MAP
# START_CHANGE_SUMMARY
#   - 2026-11-15 C-CI-RUST-TEST-ARTIFACT-LIFECYCLE-EXECVE: preserve both root Cargo selections with exact artifact cleanup.
# END_CHANGE_SUMMARY
name: CI
# Docs-only lane (owner instruction 2026-11-09): pull requests whose diff is
# confined to docs/**, .grace/changes/** or top-level *.md skip this cargo
# job — the test workflow's aggregate "status check" stays required and goes
# green over the skipped jobs. Push events always run everything.
# The filter checks for any non-doc file, so mixed PRs keep the full gate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  changes:
    name: change classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.filter.outputs.non_docs == 'false' }}
    steps:
      - name: checkout for change classification
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: docs-only lane filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            non_docs:
              - '**'
              - '!docs/**'
              - '!.grace/changes/**'
              - '!*.md'
  test:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: setup node for Rust test lifecycle
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Cargo test
        run: node tools/run-rust-tests.mjs
      - name: Fixture validation
        run: node tools/run-rust-tests.mjs embedded_fixture_parses_and_matches_registered
      - name: upload Rust lifecycle receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-test-lifecycle-${{ github.job }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mark-rust-tests-*/state.json
            ${{ runner.temp }}/mark-rust-tests-*/result.json
            ${{ runner.temp }}/mark-rust-tests-*/runner-*.json
          if-no-files-found: error
          retention-days: 1
