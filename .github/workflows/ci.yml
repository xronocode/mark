name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Cargo test
        run: cargo test
      - name: Fixture validation
        run: cargo test embedded_fixture_parses_and_matches_registered
