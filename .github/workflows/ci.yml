name: CI
# Docs-only lane (owner instruction 2026-11-09): pull requests whose diff is
# confined to docs/**, .grace/changes/** or top-level *.md skip this cargo
# job — the test workflow's aggregate "status check" stays required and goes
# green over the skipped jobs. Push events always run everything.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    name: change classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - name: docs-only lane filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs_only:
              - 'docs/**'
              - '.grace/changes/**'
              - '*.md'
  test:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Cargo test
        run: cargo test
      - name: Fixture validation
        run: cargo test embedded_fixture_parses_and_matches_registered
