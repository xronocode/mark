name: Lane CI

# Mobile and integration lanes keep their own signal. They never trigger the
# desktop CI or any desktop release workflow, and the desktop CI does not run
# for their pushes. A lane change reaches desktop only through a reviewed
# pull request into main, which runs the full desktop CI.
on:
  push:
    branches:
      - 'mobile/**'
      - 'integ/**'
  workflow_dispatch:

concurrency:
  group: lane-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: setup node for Rust test lifecycle
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Cargo test
        run: node tools/run-rust-tests.mjs
      - name: upload Rust lifecycle receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-test-lifecycle-${{ github.job }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mark-rust-tests-*/state.json
            ${{ runner.temp }}/mark-rust-tests-*/result.json
            ${{ runner.temp }}/mark-rust-tests-*/runner-*.json
          if-no-files-found: error
          retention-days: 1
