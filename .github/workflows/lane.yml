name: Lane CI

# Mobile and integration lanes keep their own signal. They never trigger the
# desktop CI or any desktop release workflow, and the desktop CI does not run
# for their pushes. A lane change reaches desktop only through a reviewed
# pull request into main, which runs the full desktop CI.
on:
  push:
    branches:
      - 'mobile/**'
      - 'integ/**'
  workflow_dispatch:

concurrency:
  group: lane-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Cargo test
        run: cargo test
