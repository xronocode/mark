# FILE: .github/workflows/release.yml
# VERSION: 3.13.0
# START_MODULE_CONTRACT
#   PURPOSE: Admit only an approved annotated release tag, build and sign its exact Ready seal, then stage one digest-verified draft release and expose it only after the owner approves the synchronous release environment gate.
#   SCOPE: Named-test manual unsigned QA handoffs plus tag-only readiness, signing, notarization, artifact verification, owner-gated draft-first publication, and downstream Homebrew handoff.
#   DEPENDS: M-046 release readiness/materials/preflight, Node 22, lockfile-installed attribution/SBOM tools, Rust 1.99.0, tauri-action, tag-restricted release-signing secrets, GitHub OIDC, release environment (owner reviewer).
#   LINKS: .grace/graph/features.xml M-046; .grace/verification/features.xml V-M-046; .grace/changes/archive/C-SEC-AUDIT-FIXES.
#   ROLE: CONFIG
#   MAP_MODE: SUMMARY
# END_MODULE_CONTRACT
#
# START_MODULE_MAP
#   authorize-tag - Reject any non-bot, lightweight, wrong-target, stale-check, or non-Ready release tag before secrets or candidate code execute. C-RELEASE-CANARY-PRERELEASE: hyphenated vX.Y.Z-beta.N/canary.N tags (base equal to the collecting train computedVersion) take the prerelease lane — payload-checks, strict admission, materials, preflight and the release-identity artifact are skipped for them while the tagger, annotated-tag and seal=HEAD checks stay. C-RELEASE-BETA-CHECKS-GATE: prerelease tags additionally collect check runs at the seal and require the pinned main set green before any signing lane runs.
#   manual-build - Run unsigned build-only QA from an input-free manual dispatch.
#   build - Build the release unsigned (no environment, no OIDC, no signing material) with the ignore-scripts install plus the single esbuild allowlist entry, re-run readiness, enforce smoke/supply-chain gates, and stage every artifact with a SHA-256 receipt sidecar for the sign job. C-RELEASE-SIGNING-SPLIT. C-RELEASE-CANARY-PRERELEASE: the admitted-evidence download, repeated strict admission, materials gate and metadata preflight are skipped for prerelease tags; packaging and smoke stay unconditional. C-RELEASE-SIGN-STAGED-SET: the Windows staged dir holds exactly the release files — the smoke screenshot lives outside it under RUNNER_TEMP\smoke, every staged file carries a SHA-256 receipt, and the Windows uploads name their files instead of release\* wildcards.
#   sign - Sole holder of the release-signing environment, the APPLE_*/TAURI_SIGNING_* secrets and the id-token/attestations OIDC: verifies every staged artifact digest against the build's recorded receipts (refusing on BLOCK_SIGN_DIGEST_MISMATCH) and signs digest-verified staged artifacts without rebuilding — Apple re-sign/notarize/staple, Tauri updater signatures, SLSA provenance and keyless cosign — then uploads the signed set under the release artifact names. C-RELEASE-SIGN-STAGED-SET: the repackage step converts the signed DMG into the sign work dir and replaces the staged copy atomically — hdiutil convert refuses an existing output and the staged unsigned DMG already occupies the destination.
#   prepare-publication - Render and digest the exact release body and asset set without write credentials. C-RELEASE-CANARY-PRERELEASE: prerelease tags get a generated body (automated verification block plus the external-tester notice) with no reviewed-notes extraction and no brew line.
#   publish - Reconcile and verify an immutable asset set on a draft, then expose it as the final owner-gated step once the build lanes are green and the owner approves the release environment. C-RELEASE-CANARY-PRERELEASE: prerelease tags publish with isPrerelease=true and an assertion that releases/latest did NOT advance (updater feed untouched).
#   publish-cask - Open or verify the exact downstream Homebrew cask update and schedule its required-check-gated auto-merge; skipped for prerelease tags. C-RELEASE-CASK-SIGNED-DIGEST: the cask sha256 is resolved only from the signed macOS release artifact by explicit path and coherence-checked against the signed DMG before any cask mutation.
# END_MODULE_MAP
#
# START_CHANGE_SUMMARY
#   - 2026-11-26 v3.13.0 GUARD-WARN-WAVE: cicd f-005 points every setup-node step at the repo-level .nvmrc (one exact runtime for checks and packaging instead of per-job '22' restatements). cicd f-009 makes the cask handoff recoverable — a bump branch pushed by a killed run carries no PR in any state (--state all proved it), so the rerun deletes the orphan branch and completes the fresh create instead of hard-failing on "cask branch exists without the exact PR"; the fresh and already-open paths are untouched (tests/tools/cask-branch-recovery.test.mjs executes the step against a synthetic tap). integration f-006 keeps the draft asset set exact — the digest manifest is written beside the body instead of inside the asset dir it used to leak from, every inventory asset must be non-empty at the assemble gate, and the publish upload loop refuses an empty asset before any draft mutation (tests/tools/draft-asset-inventory.test.mjs executes the inventory shell). The prerelease lane text is byte-identical.
#   - 2026-11-25 v3.12.0 CICD-GUARD-FIXES: F-003 renames the tag-lane admission check to release/readiness-tag — the authorize-tag job and the release-governance.yml readiness job both reported release/readiness, so a branch-build run and a tag run shared one required-context name and context resolution was ambiguous; the branch lane and the strict payload admission keep release/readiness unchanged. F-008 injects the tag version into the prerelease build override — a prerelease DMG is named from the tag while the strict metadata preflight that pins tag=metadata on the stable lane is skipped, so the beta bundle kept the repo base version; the override now carries the tag version and tag↔version parity holds for prereleases too. The stable lane's text is byte-identical.
#   - 2026-11-22 v3.11.0 C-RELEASE-SIGN-STAGED-SET: fix two execution defects in the staged handoff — the macOS sign job converts the re-packaged DMG into its work dir and replaces the staged copy (hdiutil convert refuses an existing output and the verify step's copy had already occupied the destination), the Windows smoke screenshot moves outside the staged dir (RUNNER_TEMP\smoke), the Windows stage step receipts every staged file, and both Windows uploads name their files so an unreceipted or unexpected file can neither reach the sign job nor ride the signed set; tests/tools/sign-staged-handoff.test.mjs executes the extracted handoff shells against synthetic staged sets and was red on the pre-fix text.
#   - 2026-11-22 v3.10.0 C-RELEASE-CASK-SIGNED-DIGEST: publish-cask resolves the Homebrew cask digest only from the signed macOS release artifact — the job downloads exactly mark-macos-arm64-release by name into its own path, addresses the .sha256 sidecar by that explicit artifact path (the unconstrained find/head selection over the all-artifact staged tree is gone), and coherence-checks the sidecar against a fresh hash of the signed DMG beside it, failing closed on [ReleaseCask][publish-cask][BLOCK_RELEASE_CASK_DIGEST_MISMATCH] before any cask mutation; the cask still carries the sidecar value per B2CR-3 and the prerelease skip stays byte-identical.
#   - 2026-11-22 v3.9.0 C-RELEASE-SIGNING-SPLIT: split the privileged build job into an unsigned build and a digest-gated sign job — build drops its environment, id-token/attestations and every secrets reference, installs with npm ci --ignore-scripts plus the single approved install-script exception (esbuild), builds unsigned bundles (updater artifacts disabled per the release-tauri.yml precedent) staged with a SHA-256 receipt sidecar per artifact, and the new sign job — the sole holder of the release-signing environment, the APPLE_*/TAURI_SIGNING_* secrets and the OIDC attestation authority — verifies every staged digest against those receipts before any signing step (BLOCK_SIGN_DIGEST_MISMATCH), re-signs the staged macOS bundle without rebuilding, notarizes and staples it, signs the Tauri updater archives for both platforms, composes the signed feed fragments, moves the SLSA provenance and keyless cosign over the signed set, and prepare-publication is needs-chained on sign so publication is never upstream of signing; the prerelease lane and every tag path outside the split keep byte-identical behavior.
#   - 2026-11-21 v3.8.0 C-RELEASE-BETA-CHECKS-GATE: the prerelease lane gains a fail-closed checks boundary inside authorize-tag — prerelease tags collect their commit's check runs at the seal (stable jq shape, latest attempt kept, fresh evidence on every re-run) and are rejected unless the pinned main required set (status check and release/governance, both GitHub Actions, derived from rulesets.main.requiredChecks minus this workflow's own tag-time check) is exactly-once green at that SHA; a failed, cancelled, missing, ambiguous or stale-SHA match stops the tag before the release-signing environment or any packaging job runs. The stable lane is byte-identical for non-hyphenated tags.
#   - 2026-11-17 v3.7.0 C-RELEASE-CANARY-PRERELEASE: prerelease lane for external-tester tags — authorize-tag admits vX.Y.Z-beta.N/canary.N (base = train computedVersion, no Ready seal) and skips readiness/materials/preflight plus the identity artifact; build skips the repeated admission gates; prepare-publication renders a tester body; publish exposes a prerelease that never advances releases/latest; publish-cask is skipped for prereleases. The stable path is unchanged for non-hyphenated tags.
#   - 2026-11-15 C-QA-INSTALLER-ARTIFACTS: isolate named-test QA handoffs and clean completed local binaries.
#   - 2026-11-12 C-RELEASE-ACTION-REFERENCES: resolve exact release action pins and preserve shell output under actionlint.
#   - 2026-11-09 v3.6.0 C-SEC-AUDIT-FIXES T-001: generate Node supply-chain evidence with lockfile-installed local binaries.
#   - 2026-11-09 v3.5.0 C-CI-CD-AUDIT-FIXES: split manual QA checks into fail-fast steps, disable updater artifacts only in unsigned packaging, and pin Rust and its cache keys.
#   - 2026-10-30 C-UPDATER-STATS T-005: the latest.json platform url
#     fields route through the counting gateway (updates.mark.xronocode.com/pkg/...)
#     so updater artifact fetches are counted; the signature fields and
#     the feed schema are unchanged and every URL still resolves to the
#     same GitHub bytes.
#   - 2026-10-31 v3.3.0: build the macOS release lanes on the macos-15 runner image ahead of the macos-14 retirement (both matrix os entries).
#   - 2026-10-26 v3.2.0: C-RELEASE-MANUAL-PUBLISH — repeal the C-RELEASE-TIMING
#     timer-default publication: delete the veto-window job (window, TG notify,
#     RELEASE_VETO_MINUTES, cancel-as-veto) and restore the synchronous release
#     environment approval on publish (pre-v3.0.0 shape; the owner's five-rule
#     train protocol makes publication manual-only). The de-duplicated build
#     lane and cargo caches stay untouched.
#   - 2026-10-24 v3.1.1: Point the missing updater-signing warning to the canonical owner-only GitHub rollout instructions.
#   - 2026-10-24 v3.1.0: C-RELEASE-CONVEYOR — read the train through docs/release-trains/current.json and drop the close-release-please job (Release Please removed; it failed on v2.8.1 for want of a Release Please PR).
#   - 2026-10-24 v3.0.0: C-RELEASE-TIMING — replace the synchronous second
#     owner approval with a bounded no-veto timer window (RELEASE_VETO_MINUTES,
#     default 20, clamped 120) running parallel to the builds, an optional
#     release-notify Telegram ping, and cancel-as-veto; stop re-running
#     payload-covered suites (npm test, test:e2e, standalone vite build,
#     cargo test) because strict admission already proves the status-check
#     aggregate green on the exact payload; cache the cargo-bundle-licenses
#     and cargo-cyclonedx binaries; key the cargo build cache on Cargo.lock only.
#   - 2026-10-21 v2.4.0: require the exact cask-bot PR identity, accept an already-merged exact cask as idempotent success, and schedule squash auto-merge behind the tap's required validation check.
#   - 2026-10-21 v2.3.1: bind a newly created draft by database ID with bounded retry before asset reconciliation and read-back.
#   - 2026-10-21 v2.3.0: restore the remote annotated tag object after checkout rewrites the local tag ref to its peeled commit.
#   - 2026-10-20 v2.2.0: isolate Release Please metadata permissions from publication, compare release notes byte-for-byte, and document rerunnable cask handoff.
#   - 2026-10-20 v2.1.0: separate privileged publication preparation, make updater metadata deterministic, narrow platform secrets, and add idempotent publication recovery.
#   - 2026-10-20 v2.0.0: require the owner-approved bot tag and Ready seal, isolate tag-only signing, keep manual runs unsigned, and publish only after draft asset/note/read-back verification.
#   - 2026-10-07 v1.7.1: fix compose-latest.json — the bash builtin is
#     lowercase `mapfile`; `MAPFILE` was command-not-found (exit 127) the
#     first time the merge path ran with WINDOWS_RELEASE=true (v2.2.0-beta
#     run 37575470738; both build lanes were green).
#   - 2026-09-28 v1.7.0: C-15 T-W3 — windows-x64 (NSIS, x86_64-pc-windows-msvc) build lane: CI silent-install smoke, per-platform updater-feed fragments merged in publish, Windows assets staged behind vars.WINDOWS_RELEASE (build-only until manual QA passes); literal macos-14 gates refactored to runner.os.
#   - 2026-08-07 v1.6.0: publish signed beta tags as GitHub latest releases so the configured /releases/latest updater endpoint advances.
#   - 2026-08-07 v1.5.0: fail cask publication unless its URL template resolves to the staged Tauri DMG filename.
#   - 2026-08-07 v1.4.0: classify hyphenated SemVer tags as GitHub prereleases during create and idempotent update paths.
#   - 2026-08-07 v1.3.0: build the clean-checkout renderer before Playwright preview and bound the E2E release gate to 15 minutes.
#   - 2026-08-07 v1.2.0: emit strict SemVer without the Git tag's leading v in the Tauri updater feed.
#   - 2026-08-07 v1.1.0: gate v2.1.1-beta on exact metadata/tag parity, complete tests, strict codesign, and Gatekeeper assessment.
# END_CHANGE_SUMMARY
#
# Phase-B4 release workflow.
#
# Triggered by git tag push matching v*.* — produces Developer ID
# signed + Apple-notarized, smoke-tested DMG artifacts and publishes
# them as a GitHub Release with .sha256 sidecars.
#
# Apple code signing: tauri-action reads APPLE_CERTIFICATE (base64
# .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
# APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID from secrets. It imports
# the cert into a CI keychain, signs with Developer ID, submits to
# Apple notary, and staples the ticket — all before DMG packaging.

name: release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  workflow_dispatch:
    inputs:
      qa_test_case:
        description: Active owner-requested unfinished test ID (provenance only; separate exact-candidate authorization required)
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  authorize-tag:
    name: release/readiness-tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      payload: ${{ steps.identity.outputs.payload }}
      seal: ${{ steps.identity.outputs.seal }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - name: checkout exact tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: derive and validate immutable identity
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PUSH_ACTOR: ${{ github.actor }}
          EXPECTED_TAGGER: xronocode-release-bot[bot]
        run: |
          set -euo pipefail
          [ "$EVENT_NAME" = push ]
          [ "$REF_TYPE" = tag ]
          [ "$PUSH_ACTOR" = "$EXPECTED_TAGGER" ]
          node -e "if(!/^v(?:0|[1-9]\\d*)\\.(?:0|[1-9]\\d*)\\.(?:0|[1-9]\\d*)(?:-[0-9A-Za-z.-]+)?$/.test(process.env.REF_NAME))process.exit(1)"
          git fetch --force --no-tags origin "refs/tags/$REF_NAME:refs/tags/$REF_NAME"
          TAG_REF="refs/tags/$REF_NAME"
          [ "$(git cat-file -t "$TAG_REF")" = tag ]
          SEAL=$(git rev-parse "$TAG_REF^{commit}")
          HEAD_SHA=$(git rev-parse HEAD)
          [ "$HEAD_SHA" = "$SEAL" ]
          TRAIN_ID=$(node -p "JSON.parse(require('fs').readFileSync('docs/release-trains/current.json')).trainId")
          [[ "$TRAIN_ID" =~ ^[0-9]+\.[0-9]+\.(x|[0-9]+)-next$ ]]
          TRAIN="docs/release-trains/$TRAIN_ID.json"
          STATE=$(TRAIN="$TRAIN" node -p "JSON.parse(require('fs').readFileSync(process.env.TRAIN)).state")
          PAYLOAD=$(TRAIN="$TRAIN" node -p "JSON.parse(require('fs').readFileSync(process.env.TRAIN)).payloadSha")
          EXPECTED_TAG=v$(TRAIN="$TRAIN" node -p "JSON.parse(require('fs').readFileSync(process.env.TRAIN)).computedVersion")
          # C-RELEASE-CANARY-PRERELEASE: a hyphenated owner tag
          # (vX.Y.Z-beta.N / vX.Y.Z-canary.N) rides the prerelease lane —
          # no Ready seal, no strict admission, no materials or preflight.
          # Its base must still equal the collecting train's computedVersion
          # so a beta always names this train; any other hyphen shape is
          # rejected before secrets or candidate code execute.
          PRERELEASE=false
          if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(beta|canary)\.[1-9][0-9]*$ ]]; then
            PRERELEASE=true
          elif [[ "$REF_NAME" == *"-"* ]]; then
            echo "::error::hyphenated tags must match vX.Y.Z-beta.N or vX.Y.Z-canary.N"
            exit 1
          fi
          if [ "$PRERELEASE" = false ]; then
            [ "$STATE" = Ready ]
            [ "$REF_NAME" = "$EXPECTED_TAG" ]
          else
            [[ "$STATE" =~ ^(Collecting|Preparing|Frozen|Ready)$ ]]
            BASE_TAG="${REF_NAME%%-*}"
            [ "$BASE_TAG" = "$EXPECTED_TAG" ]
          fi
          {
            echo "tag=$REF_NAME"
            echo "payload=$PAYLOAD"
            echo "seal=$SEAL"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      # C-RELEASE-BETA-CHECKS-GATE: this collection keys on the tag's HEAD
      # SHA (the seal) and never on the train payload field. The stable jq
      # shape below sorts by started time and groups per name+app keeping
      # the latest attempt, which is what makes a superseded earlier attempt
      # (a flaky red re-run) resolve to the latest one. No artifact, cache
      # or cross-run state exists on this path: a re-run re-collects fresh
      # evidence.
      - name: collect prerelease check runs at the seal
        if: steps.identity.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SEAL: ${{ steps.identity.outputs.seal }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/commits/$SEAL/check-runs?per_page=100" \
            | jq '[.[].check_runs[]] | sort_by(.started_at) | group_by(.name + "|" + .app.name) | map(last | {name, app:.app.name, sha:.head_sha, conclusion})' \
            > /tmp/release-checks.json

      # C-RELEASE-BETA-CHECKS-GATE: the pinned set is the main-branch
      # required contexts derived from
      # .github/release-governance.json rulesets.main.requiredChecks, pinned
      # here in the workflow source instead of read from the config so the
      # gate cannot silently drift with a config edit. release/readiness-tag
      # is excluded because it is the tag-time check of this very workflow
      # and cannot pre-exist on the beta commit — requiring it here would
      # deadlock the lane. F-003 renamed this lane so the tag-time check no
      # longer collides with the branch-lane release/readiness.
      - name: gate prerelease required checks
        if: steps.identity.outputs.prerelease == 'true'
        env:
          SEAL: ${{ steps.identity.outputs.seal }}
          PRERELEASE_REQUIRED_CHECKS: '[{"name":"status check","app":"GitHub Actions"},{"name":"release/governance","app":"GitHub Actions"}]'
        run: |
          set -euo pipefail
          node -e '
            const checks = JSON.parse(require("fs").readFileSync("/tmp/release-checks.json", "utf8"));
            const required = JSON.parse(process.env.PRERELEASE_REQUIRED_CHECKS);
            const seal = process.env.SEAL;
            let rejected = false;
            const reject = (identity, reason) => {
              console.error("::error::[ReleaseAuthorize][authorize-tag][BLOCK_PRERELEASE_CHECKS_NOT_GREEN] " + identity.name + " (" + identity.app + "): " + reason);
              rejected = true;
            };
            for (const identity of required) {
              const matches = checks.filter((check) => check.name === identity.name && check.app === identity.app);
              if (matches.length === 0) reject(identity, "missing from the check runs collected at the seal");
              else if (matches.length > 1) reject(identity, "ambiguous identity: " + matches.length + " live matches");
              else if (matches[0].sha !== seal) reject(identity, "stale: recorded at " + matches[0].sha + " instead of the seal");
              else if (matches[0].conclusion !== "success") reject(identity, "conclusion is " + matches[0].conclusion + ", not success");
            }
            if (rejected) process.exit(1);
          '

      - name: read exact payload check runs
        if: steps.identity.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD: ${{ steps.identity.outputs.payload }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/commits/$PAYLOAD/check-runs?per_page=100" \
            | jq '[.[].check_runs[]] | sort_by(.started_at) | group_by(.name + "|" + .app.name) | map(last | {name, app:.app.name, sha:.head_sha, conclusion})' \
            > /tmp/release-checks.json

      - name: strict online release admission
        if: steps.identity.outputs.prerelease != 'true'
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          PAYLOAD: ${{ steps.identity.outputs.payload }}
          SEAL: ${{ steps.identity.outputs.seal }}
          HEAD_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --mode strict --tag "$TAG" --payload "$PAYLOAD" --seal "$SEAL" --head "$HEAD_SHA" --checks-file /tmp/release-checks.json

      - name: materials and version admission
        if: steps.identity.outputs.prerelease != 'true'
        env:
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          npm run release:materials -- --tag "$TAG"
          npm run release:preflight -- --tag "$TAG"

      - name: preserve checked identity for packaging
        if: steps.identity.outputs.prerelease != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-identity
          path: /tmp/release-checks.json
          if-no-files-found: error
          retention-days: 1

  manual-build:
    name: unsigned QA build (${{ matrix.platform.name }})
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: read
    steps:
      - name: checkout selected commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.platform.target }}
      - name: install npm dependencies
        run: npm ci
      - name: prepare isolated QA identity
        id: qa
        env:
          QA_SOURCE_SHA: ${{ github.sha }}
          QA_CANDIDATE_SHA: ${{ github.sha }}
          QA_RUN_ID: ${{ github.run_id }}
          QA_RUN_ATTEMPT: ${{ github.run_attempt }}
          QA_PLATFORM: ${{ matrix.platform.name }}
          QA_MODE: manual-handoff
          QA_TEST_CASE: ${{ inputs.qa_test_case }}
        run: node tools/prepare-qa-artifacts.mjs prepare
      - name: verify release governance
        run: npm run release:governance
      - name: verify IPC types
        run: npm run typecheck:ipc
      - name: run renderer tests
        run: npm test
      - name: build renderer
        run: npm run build
      - name: run Rust tests
        shell: bash
        env:
          QA_STATE: ${{ steps.qa.outputs.state }}
        run: node tools/run-qa-rust-tests.mjs --state "$QA_STATE"
      - name: package unsigned QA build
        shell: bash
        env:
          QA_CONFIG: ${{ steps.qa.outputs.config }}
        run: |
          set -euo pipefail
          # Bypass npm.cmd on Windows so the JSON override reaches Tauri intact.
          node ./node_modules/@tauri-apps/cli/tauri.js build --target "${{ matrix.platform.target }}" --config "$QA_CONFIG"

      - name: record generated QA outputs
        shell: bash
        env:
          QA_STATE: ${{ steps.qa.outputs.state }}
        run: node tools/prepare-qa-artifacts.mjs record --state "$QA_STATE"
      - name: collect exact QA installer
        shell: bash
        env:
          QA_STATE: ${{ steps.qa.outputs.state }}
        run: node tools/prepare-qa-artifacts.mjs collect --state "$QA_STATE"
      # This case ID does not establish owner authorization. Dispatch requires
      # a prior explicit request for this exact candidate and unfinished test.
      - name: upload requested QA installer
        id: qa_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.qa.outputs.artifact_name }}
          path: ${{ steps.qa.outputs.handoff }}
          if-no-files-found: error
          retention-days: 1
      - name: record QA upload identity
        shell: bash
        env:
          QA_STATE: ${{ steps.qa.outputs.state }}
          QA_UPLOAD_ID: ${{ steps.qa_upload.outputs.artifact-id }}
          QA_UPLOAD_DIGEST: ${{ steps.qa_upload.outputs.artifact-digest }}
        run: node tools/prepare-qa-artifacts.mjs upload-receipt --state "$QA_STATE"
      - name: remove local QA binaries
        if: always() && steps.qa.outputs.state != ''
        shell: bash
        env:
          QA_STATE: ${{ steps.qa.outputs.state }}
        run: node tools/prepare-qa-artifacts.mjs cleanup --state "$QA_STATE"
      - name: upload QA lifecycle evidence
        if: always() && steps.qa.outputs.state != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.qa.outputs.artifact_name }}-evidence
          path: ${{ steps.qa.outputs.evidence }}
          if-no-files-found: error
          retention-days: 14

  build:
    name: build (${{ matrix.platform.name }})
    needs: authorize-tag
    if: github.event_name == 'push' && needs.authorize-tag.result == 'success'
    permissions:
      contents: read
      checks: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          # C-15 T-W3: Windows lane — NSIS x64 installer + updater
          # artifacts. Windows release assets are staged behind the
          # WINDOWS_RELEASE repo variable (see the publish job): until it
          # is set, the exe is a workflow artifact for manual QA only.
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    # bash on both OSes: the runner scripts below are POSIX; Windows
    # runners resolve bash via Git for Windows. PowerShell is opted into
    # per-step via `shell: pwsh` where native tooling demands it.
    defaults:
      run:
        shell: bash

    outputs:
      tag: ${{ steps.resolve_tag.outputs.tag }}

    steps:
      # ── checkout + tooling ────────────────────────────────────────
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: resolve tag
        id: resolve_tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ]; then
            echo "::error::could not resolve tag from the pushed tag ref"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "resolved tag: $TAG"

      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: setup rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.platform.target }}

      - name: cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Key on the Rust toolchain and Cargo.lock; hashing every Rust
          # source line dropped the whole target dir on any src change,
          # so incremental release rebuilds never stayed warm.
          key: cargo-workspace-v1-${{ matrix.platform.target }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            cargo-workspace-v1-${{ matrix.platform.target }}-

      - name: download admitted check evidence
        if: needs.authorize-tag.outputs.prerelease != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-identity
          path: ${{ runner.temp }}/release-identity

      # ── install + build frontend ─────────────────────────────────
      # C-RELEASE-SIGNING-SPLIT: the release lane installs with lifecycle
      # scripts disabled. esbuild is the single approved install-script exception (esbuild);
      # it is the only hasInstallScript package this change allows, matching
      # the authorize-tag --ignore-scripts precedent at the tag-admission
      # job. Any future entry requires a reviewed change adding it here
      # explicitly; no platform package gets lifecycle scripts back.
      - name: install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: run allowlisted esbuild install script
        run: node node_modules/esbuild/install.js

      - name: repeat strict release admission before packaging
        if: needs.authorize-tag.outputs.prerelease != 'true'
        env:
          TAG: ${{ needs.authorize-tag.outputs.tag }}
          PAYLOAD: ${{ needs.authorize-tag.outputs.payload }}
          SEAL: ${{ needs.authorize-tag.outputs.seal }}
          HEAD_SHA: ${{ github.sha }}
          CHECKS_FILE: ${{ runner.temp }}/release-identity/release-checks.json
        run: npm run release:readiness -- --mode strict --tag "$TAG" --payload "$PAYLOAD" --seal "$SEAL" --head "$HEAD_SHA" --checks-file "$CHECKS_FILE"

      - name: release materials gate
        if: needs.authorize-tag.outputs.prerelease != 'true'
        env:
          TAG: ${{ needs.authorize-tag.outputs.tag }}
        run: npm run release:materials -- --tag "$TAG"

      - name: release metadata preflight
        if: needs.authorize-tag.outputs.prerelease != 'true'
        env:
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: npm run release:preflight -- --tag "$TAG"

      - name: renderer IPC typecheck
        run: npm run typecheck:ipc

      # C-RELEASE-TIMING: the payload suites (vitest x3 OS, cargo test
      # x3 OS, playwright chromium + WebKit) are not re-run here. Strict
      # admission above already proved every strictRequiredChecks entry —
      # including the aggregated "status check" over those suites — green
      # on the exact payload SHA, and the payload-to-seal delta is
      # metadata-only. The renderer itself is still built by tauri's
      # beforeBuildCommand in the packaging step below. typecheck:ipc
      # stays: it is not part of the payload CI aggregate.

      # ── tauri build (unsigned bundles) ───────────────────────────
      # C-RELEASE-SIGNING-SPLIT: this job holds no signing material — the
      # APPLE_*/TAURI_* env moved to the sign job, which re-signs the
      # digest-verified staged bundle without rebuilding. The config
      # override below follows the release-tauri.yml unsigned-bundle
      # precedent: updater signing is disabled here and the signed updater
      # archives plus their signatures are produced in the sign job from
      # the staged bytes.
      - name: write unsigned bundle override
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/unsigned-build.config.json" <<'JSON'
          {
            "bundle": {
              "createUpdaterArtifacts": false
            }
          }
          JSON

      # F-008: a prerelease tag names the shipped bundle
      # (Mark_<VER>_aarch64.dmg) while the strict metadata preflight that
      # proves tag = repo metadata on the stable lane is skipped here — so
      # without this override the beta bundle kept the repo's base version.
      # Inject the tag version into the same override config the tauri build
      # consumes (the prepare-qa-artifacts.mjs config-merge precedent) so the
      # packaged app, installer and updater identity match the tag exactly as
      # they do on a stable build, whose admitted metadata already equals it.
      - name: inject prerelease version override
        if: needs.authorize-tag.outputs.prerelease == 'true'
        env:
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          node -e '
            const fs = require("fs");
            const [configPath, version] = process.argv.slice(1);
            const config = JSON.parse(fs.readFileSync(configPath, "utf8"));
            config.version = version;
            fs.writeFileSync(configPath, JSON.stringify(config, null, 2) + "\n");
          ' "$RUNNER_TEMP/unsigned-build.config.json" "$VER"
          cat "$RUNNER_TEMP/unsigned-build.config.json"

      - name: tauri build (macOS unsigned bundle)
        if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          args: --target ${{ matrix.platform.target }} --config '${{ runner.temp }}/unsigned-build.config.json'

      - name: tauri build (Windows unsigned bundle)
        if: runner.os == 'Windows'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          args: --target ${{ matrix.platform.target }} --config '${{ runner.temp }}/unsigned-build.config.json'

      # ── smoke launch ─────────────────────────────────────────────
      - name: smoke launch
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          DMG=$(find target -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::no .dmg artifact produced"
            exit 1
          fi
          MOUNT=/tmp/mark-dmg
          mkdir -p "$MOUNT"
          hdiutil attach "$DMG" -nobrowse -mountpoint "$MOUNT" -readonly
          cp -R "$MOUNT/Mark.app" /Applications/
          hdiutil detach "$MOUNT"
          # C-RELEASE-SIGNING-SPLIT: the staged bundle is unsigned — re-sign
          # it ad hoc for this local launch only (the release-tauri.yml
          # unsigned-launch precedent). Developer ID signing, notarization,
          # stapling and the strict verification run in the sign job.
          codesign --force --deep -s - /Applications/Mark.app
          open -a /Applications/Mark.app
          for i in $(seq 1 10); do
            if pgrep -f 'Mark.app/Contents/MacOS/mark' > /dev/null; then
              echo "alive after ${i}s"
              break
            fi
            sleep 1
          done
          if ! pgrep -f 'Mark.app/Contents/MacOS/mark' > /dev/null; then
            echo "::error::Mark process did not appear within 10s of open"
            exit 1
          fi
          pkill -9 -f 'Mark.app/Contents/MacOS/mark' || true

      # ── bundle size budget ───────────────────────────────────────
      - name: bundle size
        if: runner.os == 'macOS'
        id: size
        run: |
          set -euo pipefail
          APP_PATH=/Applications/Mark.app
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find target -name 'Mark.app' -type d | head -1)
          fi
          BYTES=$(du -sk "$APP_PATH" | awk '{print $1*1024}')
          HUMAN=$(du -sh "$APP_PATH" | awk '{print $1}')
          echo "bundle_bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "bundle_human=$HUMAN" >> "$GITHUB_OUTPUT"
          {
            echo "## Bundle size — ${{ matrix.platform.name }}"
            echo
            echo "- \`du -sh\`: **$HUMAN**"
            echo "- bytes: $BYTES"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── warnings allowlist ───────────────────────────────────────
      - name: warnings allowlist check
        if: runner.os == 'macOS'
        run: |
          set -uo pipefail  # NOT -e so we can show JSON before failing
          cd src-tauri
          cargo build --release --bin mark --message-format=json > /tmp/cargo.json
          cd ..
          node tools/check-warnings-allowlist.mjs /tmp/cargo.json docs/ci-warnings-allowlist.md \
            | tee /tmp/toolchain-warnings.json
          RC=${PIPESTATUS[0]}
          echo "---"
          echo "verifier exit code: $RC"
          exit "$RC"

      # ── attribution-completeness gate (B4 step-9) ────────────────
      # Re-runs license-checker + cargo-bundle-licenses, diffs against
      # committed NOTICES-{node,rust}.md. New deps without an attribution
      # line fail the build.
      # C-RELEASE-TIMING: these cargo-install steps compiled both tools
      # from source on every tag (~3-5 min); the ~/.cargo/bin cache below
      # plus the command -v guard restores them warm.
      - name: cache cargo attribution and sbom tools
        if: runner.os == 'macOS'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin
          key: cargo-tools-macos-${{ hashFiles('rust-toolchain.toml') }}-bundle-licenses-4.2.0-cyclonedx-0.5.9

      - name: install cargo-bundle-licenses
        if: runner.os == 'macOS'
        run: command -v cargo-bundle-licenses >/dev/null || cargo install cargo-bundle-licenses --version 4.2.0 --locked

      - name: verify attributions
        if: runner.os == 'macOS'
        run: ./tools/verify-attributions.sh

      # ── SBOM generation (B4 step-9) ──────────────────────────────
      # CycloneDX SPDX-compatible SBOM for the Tauri binary + Node
      # renderer dependency closure. Published alongside the DMG so
      # downstream auditors can verify the supply chain.
      - name: install cargo-cyclonedx
        if: runner.os == 'macOS'
        run: command -v cargo-cyclonedx >/dev/null || cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: generate SBOM
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p sbom
          # Node side: production deps only
          ./node_modules/.bin/cyclonedx-npm \
            --output-format JSON \
            --output-file sbom/sbom-node.cdx.json \
            --omit dev \
            --ignore-npm-errors
          # Rust side — cargo-cyclonedx 0.5.x writes <crate>.cdx.json
          # to the manifest directory; we relocate to sbom/.
          (cd src-tauri && cargo cyclonedx --format json)
          mv src-tauri/mark.cdx.json sbom/sbom-rust.cdx.json
          ls -la sbom/

      # ── updater feed fragment (B4 step-5, C-15 T-W3) ────────────
      # Each build lane emits a per-platform fragment; the publish job
      # merges every staged fragment into one latest.json (darwin-aarch64
      # required, windows-x86_64 optional). If signing keys aren't
      # provisioned, the .sig file is missing and the lane skips its
      # fragment (graceful degradation).
      - name: build updater feed fragment (macos)
        if: runner.os == 'macOS'
        id: feed
        env:
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          SIG_FILE=$(find target -name '*.app.tar.gz.sig' | head -1)
          TGZ_FILE=$(find target -name '*.app.tar.gz' ! -name '*.sig' | head -1)
          if [ -z "$SIG_FILE" ] || [ -z "$TGZ_FILE" ]; then
            echo "::warning::updater signing artifacts missing; latest.json not generated. Configure TAURI_SIGNING_PRIVATE_KEY+_PASSWORD secrets per docs/release-trains/README.md#owner-only-github-rollout."
            echo "skipped=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SIG=$(cat "$SIG_FILE")
          mkdir -p /tmp/release
          # Copy the .app.tar.gz so it gets uploaded as a release asset.
          cp "$TGZ_FILE" "/tmp/release/Mark_${VER}_aarch64.app.tar.gz"
          cat > /tmp/release/latest-platform.json <<JSON
          {
            "platforms": {
              "darwin-aarch64": {
                "signature": "${SIG}",
                "url": "https://updates.mark.xronocode.com/pkg/darwin-aarch64/${VER}"
              }
            }
          }
          JSON
          echo "skipped=0" >> "$GITHUB_OUTPUT"
          cat /tmp/release/latest-platform.json

      # ── stage release artifacts ──────────────────────────────────
      # Per B2CR-3: the cask sources sha256 from a .sha256 sidecar that
      # ships with the DMG, NOT a recomputed value. CI emits the sidecar
      # so the cask formula and the release artifact agree.
      - name: stage release artifacts
        if: runner.os == 'macOS'
        id: stage
        env:
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          DMG_SRC=$(find target -name '*.dmg' | head -1)
          if [ -z "$DMG_SRC" ]; then
            echo "::error::no .dmg artifact produced"
            exit 1
          fi
          # Strip leading 'v' from tag for filename version segment
          # (matches v1 cask convention: Mark_1.2.3_aarch64.dmg).
          VER=${TAG#v}
          DMG_DST=/tmp/release/Mark_${VER}_aarch64.dmg
          cp "$DMG_SRC" "$DMG_DST"
          shasum -a 256 "$DMG_DST" | awk '{print $1}' > "$DMG_DST.sha256"
          # B4-step-8 attribution + B4-step-9 SBOM artifacts shipped
          # alongside the DMG so downstream cask + audit consumers
          # don't need to re-clone the repo.
          cp NOTICES-node.md /tmp/release/
          cp NOTICES-rust.md /tmp/release/
          cp sbom/sbom-node.cdx.json "/tmp/release/Mark_${VER}_sbom-node.cdx.json"
          cp sbom/sbom-rust.cdx.json "/tmp/release/Mark_${VER}_sbom-rust.cdx.json"
          # C-RELEASE-SIGNING-SPLIT: every staged artifact carries a SHA-256
          # receipt sidecar so the sign job can recompute the complete
          # staged set digest-by-digest before any signing material is used.
          for STAGED in /tmp/release/NOTICES-node.md /tmp/release/NOTICES-rust.md \
            "/tmp/release/Mark_${VER}_sbom-node.cdx.json" \
            "/tmp/release/Mark_${VER}_sbom-rust.cdx.json"
          do
            shasum -a 256 "$STAGED" | awk '{print $1}' > "$STAGED.sha256"
          done
          ls -la /tmp/release
          echo "dmg=$DMG_DST" >> "$GITHUB_OUTPUT"
          echo "sha256=$DMG_DST.sha256" >> "$GITHUB_OUTPUT"

      # ── Windows: smoke + size + feed fragment + stage (C-15 T-W3) ─
      # Smoke = silent NSIS install (/S), launch installed Mark.exe,
      # poll Get-Process, screenshot for the run log, then kill. The
      # GitHub windows runner session supports GUI app launches.
      - name: windows smoke (silent install + launch)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem -Recurse -Filter '*-setup.exe' -Path target |
            Where-Object { $_.Name -notlike '*.sig' } |
            Select-Object -First 1
          if (-not $setup) { throw '::error::no NSIS setup exe produced' }
          Write-Host "installer: $($setup.FullName)"

          # currentUser install mode → %LOCALAPPDATA%\Mark (fall back to
          # Program Files probe just in case the mode ever changes).
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = @(
            (Join-Path $env:LOCALAPPDATA 'Mark\Mark.exe')
            (Join-Path $env:ProgramFiles 'Mark\Mark.exe')
            (Join-Path ${env:ProgramFiles(x86)} 'Mark\Mark.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw '::error::Mark.exe not found after silent install' }
          Write-Host "installed: $exe"

          Start-Process -FilePath $exe
          $alive = $false
          foreach ($i in 1..20) {
            Start-Sleep -Seconds 1
            if (Get-Process -Name 'Mark' -ErrorAction SilentlyContinue) {
              $alive = $true
              Write-Host "alive after ${i}s"
              break
            }
          }
          if (-not $alive) { throw '::error::Mark process did not appear within 20s of launch' }

          # C-15 QA evidence: capture what the window actually looks like
          # (manual-QA feedback triage — layout overlap / maximize issues).
          # 10s: cold WebView2 on a fresh runner needs several seconds before
          # the renderer paints (3s captured a blank white window).
          Start-Sleep -Seconds 10
          try {
            New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\smoke" | Out-Null
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $ws = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $ws.Width, $ws.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($ws.Location, [System.Drawing.Point]::Empty, $ws.Size)
            $bmp.Save("$env:RUNNER_TEMP\smoke\app-screenshot.png")
            Write-Host "screenshot saved"
          } catch {
            Write-Host "screenshot failed: $_"
          }

          Stop-Process -Name 'Mark' -Force -ErrorAction SilentlyContinue

      - name: windows bundle size
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          EXE=$(find target -name '*-setup.exe' ! -name '*.sig' | head -1)
          if [ -z "$EXE" ]; then
            echo "::error::no NSIS setup exe produced"
            exit 1
          fi
          BYTES=$(wc -c < "$EXE" | tr -d ' ')
          HUMAN=$(( BYTES / 1024 / 1024 ))MB
          # Footprint positioning gate: the installer must stay small.
          if [ "$BYTES" -gt 20000000 ]; then
            echo "::error::windows installer exceeds the 20 MB footprint budget ($HUMAN, $BYTES bytes)"
            exit 1
          fi
          {
            echo "## Bundle size — ${{ matrix.platform.name }}"
            echo
            echo "- installer: **$HUMAN** ($BYTES bytes)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: build updater feed fragment (windows)
        if: runner.os == 'Windows'
        id: feed_win
        env:
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          SIG_FILE=$(find target -name '*-setup.exe.sig' | head -1)
          EXE_FILE=$(find target -name '*-setup.exe' ! -name '*.sig' | head -1)
          STAGE_DIR="$RUNNER_TEMP/release"
          mkdir -p "$STAGE_DIR"
          if [ -z "$SIG_FILE" ] || [ -z "$EXE_FILE" ]; then
            echo "::warning::windows updater artifacts missing; fragment not generated."
            echo "skipped=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SIG=$(cat "$SIG_FILE")
          cp "$EXE_FILE" "$STAGE_DIR/Mark_${VER}_x64-setup.exe"
          cat > "$STAGE_DIR/latest-platform.json" <<JSON
          {
            "platforms": {
              "windows-x86_64": {
                "signature": "${SIG}",
                "url": "https://updates.mark.xronocode.com/pkg/windows-x86_64/${VER}"
              }
            }
          }
          JSON
          echo "skipped=0" >> "$GITHUB_OUTPUT"
          cat "$STAGE_DIR/latest-platform.json"

      - name: stage release artifacts (windows)
        if: runner.os == 'Windows'
        id: stage_win
        env:
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          STAGE_DIR="$RUNNER_TEMP/release"
          mkdir -p "$STAGE_DIR"
          EXE_DST="$STAGE_DIR/Mark_${VER}_x64-setup.exe"
          if [ ! -f "$EXE_DST" ]; then
            EXE_SRC=$(find target -name '*-setup.exe' ! -name '*.sig' | head -1)
            if [ -z "$EXE_SRC" ]; then
              echo "::error::no NSIS setup exe produced"
              exit 1
            fi
            cp "$EXE_SRC" "$EXE_DST"
          fi
          # node-based sha256 (shasum/perl availability differs on the
          # Windows image; node is guaranteed). C-RELEASE-SIGN-STAGED-SET:
          # every staged file carries a receipt so the sign job's digest
          # verifier accepts the set (sidecars skipped so re-runs stay
          # correct).
          for STAGED in "$STAGE_DIR"/*; do
            case "$STAGED" in
              *.sha256) continue ;;
            esac
            HASH=$(node -e "const c=require('crypto'),f=require('fs');process.stdout.write(c.createHash('sha256').update(f.readFileSync(process.argv[1])).digest('hex'))" "$STAGED")
            echo "$HASH" > "$STAGED.sha256"
          done
          ls -la "$STAGE_DIR"

      # ── upload staged unsigned artifacts for the sign job ────────
      # C-RELEASE-SIGNING-SPLIT: the signed set is uploaded by the sign job
      # under the release artifact names downstream jobs already consume;
      # this -staged handoff carries the unsigned bundle plus its SHA-256
      # receipts and is verified digest-by-digest before any signing runs.
      - name: upload staged unsigned artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mark-${{ matrix.platform.name }}-release-staged
          path: |
            /tmp/release/*.dmg
            /tmp/release/*.sha256
            /tmp/release/Mark_*_sbom-*.cdx.json
            /tmp/release/NOTICES-*.md
          if-no-files-found: error
          retention-days: 30

      # Always uploaded (also while WINDOWS_RELEASE is off) so the sign job
      # can sign the Windows set for later staging behind the repo variable.
      - name: upload staged unsigned artifacts (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mark-${{ matrix.platform.name }}-release-staged
          path: |
            ${{ runner.temp }}\release\Mark_*_x64-setup.exe
            ${{ runner.temp }}\release\Mark_*_x64-setup.exe.sha256
            ${{ runner.temp }}\release\latest-platform.json
            ${{ runner.temp }}\release\latest-platform.json.sha256
          if-no-files-found: error
          retention-days: 30

  sign:
    name: sign (${{ matrix.platform.name }})
    # C-RELEASE-SIGNING-SPLIT: this job is the sole holder of the
    # release-signing environment, the APPLE_*/TAURI_SIGNING_* secrets and
    # the id-token/attestations OIDC. Its first signing-related action is
    # digest verification of the staged set; no secret is referenced before
    # that verification passes. Needs are declared in block style so the
    # exact string of the old pre-split chain can never reappear.
    needs:
      - authorize-tag
      - build
    if: github.event_name == 'push' && needs.authorize-tag.result == 'success'
    environment: release-signing
    permissions:
      contents: read
      checks: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    # bash on both OSes, mirroring the build job's defaults.
    defaults:
      run:
        shell: bash

    steps:
      - name: checkout release seal
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The local Tauri CLI is required for the updater signatures; the
      # install stays script-free (no esbuild entry is needed here — this
      # job never executes esbuild).
      - name: install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: download staged release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mark-${{ matrix.platform.name }}-release-staged
          path: ${{ runner.temp }}/staged

      # ── verify-then-sign ─────────────────────────────────────────
      # C-RELEASE-SIGNING-SPLIT: this step recomputes every staged
      # artifact's digest against the build job's recorded SHA-256 receipts
      # and refuses the run on any mismatch, missing receipt or unexpected
      # extra staged file BEFORE any secret is touched. No status-swallowing
      # construct exists around the comparison.
      - name: verify staged artifact digests
        if: runner.os == 'macOS'
        env:
          STAGE: ${{ runner.temp }}/staged
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          cp "$STAGE"/* /tmp/release/
          cd /tmp/release
          MISMATCH=0
          for FILE in $(find . -type f ! -name '*.sha256' | sed 's|^\./||' | sort); do
            RECEIPT="$FILE.sha256"
            if [ ! -f "$RECEIPT" ]; then
              echo "::error::[ReleaseSign][sign][BLOCK_SIGN_DIGEST_MISMATCH] $FILE: no .sha256 receipt staged for this artifact"
              MISMATCH=1
              continue
            fi
            EXPECTED=$(awk '{print $1}' "$RECEIPT")
            ACTUAL=$(shasum -a 256 "$FILE" | awk '{print $1}')
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "::error::[ReleaseSign][sign][BLOCK_SIGN_DIGEST_MISMATCH] $FILE: receipt $EXPECTED != computed $ACTUAL"
              MISMATCH=1
            fi
          done
          for RECEIPT in $(find . -type f -name '*.sha256' | sed 's|^\./||' | sort); do
            if [ ! -f "${RECEIPT%.sha256}" ]; then
              echo "::error::[ReleaseSign][sign][BLOCK_SIGN_DIGEST_MISMATCH] $RECEIPT: receipt without a staged artifact"
              MISMATCH=1
            fi
          done
          if [ "$MISMATCH" -ne 0 ]; then
            echo "::error::[ReleaseSign][sign][BLOCK_SIGN_DIGEST_MISMATCH] staged set failed digest verification; refusing to sign"
            exit 1
          fi

      - name: verify staged artifact digests (windows)
        if: runner.os == 'Windows'
        env:
          STAGE: ${{ runner.temp }}/staged
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_DIR"
          cp "$STAGE"/* "$RELEASE_DIR"/
          cd "$RELEASE_DIR"
          MISMATCH=0
          for FILE in $(find . -type f ! -name '*.sha256' | sed 's|^\./||' | sort); do
            RECEIPT="$FILE.sha256"
            if [ ! -f "$RECEIPT" ]; then
              echo "::error::[ReleaseSign][sign][BLOCK_SIGN_DIGEST_MISMATCH] $FILE: no .sha256 receipt staged for this artifact"
              MISMATCH=1
              continue
            fi
            EXPECTED=$(awk '{print $1}' "$RECEIPT")
            ACTUAL=$(node -e "const c=require('crypto'),f=require('fs');process.stdout.write(c.createHash('sha256').update(f.readFileSync(process.argv[1])).digest('hex'))" "$FILE")
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "::error::[ReleaseSign][sign][BLOCK_SIGN_DIGEST_MISMATCH] $FILE: receipt $EXPECTED != computed $ACTUAL"
              MISMATCH=1
            fi
          done
          for RECEIPT in $(find . -type f -name '*.sha256' | sed 's|^\./||' | sort); do
            if [ ! -f "${RECEIPT%.sha256}" ]; then
              echo "::error::[ReleaseSign][sign][BLOCK_SIGN_DIGEST_MISMATCH] $RECEIPT: receipt without a staged artifact"
              MISMATCH=1
            fi
          done
          if [ "$MISMATCH" -ne 0 ]; then
            echo "::error::[ReleaseSign][sign][BLOCK_SIGN_DIGEST_MISMATCH] staged set failed digest verification; refusing to sign"
            exit 1
          fi

      # ── Apple re-sign of the staged bundle (no rebuild) ──────────
      # C-RELEASE-SIGNING-SPLIT: tauri-action's build+sign coupling is
      # deliberately not used here — this job signs the digest-verified
      # staged bytes: it re-signs the staged .app with the Developer ID
      # identity, notarizes, staples and repackages the DMG from the signed
      # app. Rebuilding inside sign is out of bounds.
      - name: import Apple signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/DeveloperID.p12"
          KEYCHAIN="$RUNNER_TEMP/mark-release-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo -n "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$(security list-keychains -d user | tr '\n' ' ')"
          rm -f "$CERT_PATH"

      - name: re-sign staged app with Developer ID
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP_WORK="$RUNNER_TEMP/sign-work"
          RW_DMG="$APP_WORK/staged-rw.dmg"
          MOUNT="$RUNNER_TEMP/staged-mount"
          mkdir -p "$APP_WORK"
          DMG=$(find /tmp/release -name 'Mark_*.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::no staged DMG found"
            exit 1
          fi
          hdiutil convert "$DMG" -format UDRW -o "$RW_DMG"
          hdiutil attach "$RW_DMG" -nobrowse -mountpoint "$MOUNT"
          cp -R "$MOUNT/Mark.app" "$APP_WORK/Mark.app"
          rm -rf "$MOUNT/Mark.app"
          hdiutil detach "$MOUNT"
          codesign --force --deep --sign "$APPLE_SIGNING_IDENTITY" --options runtime --timestamp "$APP_WORK/Mark.app"

      - name: notarize and staple the signed app
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP_WORK="$RUNNER_TEMP/sign-work"
          ZIP="$APP_WORK/Mark.app.zip"
          ditto -c -k --keepParent "$APP_WORK/Mark.app" "$ZIP"
          xcrun notarytool submit "$ZIP" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$APP_WORK/Mark.app"
          APP_PATH="$APP_WORK/Mark.app"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: repackage and notarize the staged DMG
        if: runner.os == 'macOS'
        env:
          TAG: ${{ needs.build.outputs.tag }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          APP_WORK="$RUNNER_TEMP/sign-work"
          RW_DMG="$APP_WORK/staged-rw.dmg"
          MOUNT="$RUNNER_TEMP/staged-mount"
          hdiutil attach "$RW_DMG" -nobrowse -mountpoint "$MOUNT"
          cp -R "$APP_WORK/Mark.app" "$MOUNT/Mark.app"
          hdiutil detach "$MOUNT"
          DMG_DST="/tmp/release/Mark_${VER}_aarch64.dmg"
          # C-RELEASE-SIGN-STAGED-SET: convert into the sign work dir and replace the destination atomically — the verify step's cp of the staged set already occupies /tmp/release/Mark_${VER}_aarch64.dmg, and hdiutil convert refuses an existing output.
          SIGNED_OUT="$APP_WORK/Mark_${VER}_aarch64.dmg"
          hdiutil convert "$RW_DMG" -format UDZO -o "$SIGNED_OUT"
          mv -f "$SIGNED_OUT" "$DMG_DST"
          xcrun notarytool submit "$DMG_DST" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG_DST"

      # ── Tauri updater signing + signed feed fragments ────────────
      # The fragments are recomposed byte-identically to the pre-split
      # composition; only the signature's origin moved into this job.
      - name: sign updater archive and compose feed fragment (macos)
        if: runner.os == 'macOS'
        env:
          TAG: ${{ needs.build.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          APP_WORK="$RUNNER_TEMP/sign-work"
          TGZ="/tmp/release/Mark_${VER}_aarch64.app.tar.gz"
          tar -czf "$TGZ" -C "$APP_WORK" Mark.app
          node node_modules/@tauri-apps/cli/tauri.js signer sign "$TGZ"
          test -f "$TGZ.sig"
          SIG=$(cat "$TGZ.sig")
          cat > /tmp/release/latest-platform.json <<JSON
          {
            "platforms": {
              "darwin-aarch64": {
                "signature": "${SIG}",
                "url": "https://updates.mark.xronocode.com/pkg/darwin-aarch64/${VER}"
              }
            }
          }
          JSON
          # C-RELEASE-SIGNING-SPLIT: re-emit fresh SHA-256 receipts for
          # everything this job repackaged or signed.
          for SIGNED in "/tmp/release/Mark_${VER}_aarch64.dmg" "$TGZ" /tmp/release/latest-platform.json; do
            shasum -a 256 "$SIGNED" | awk '{print $1}' > "$SIGNED.sha256"
          done
          cat /tmp/release/latest-platform.json

      - name: sign updater installer and compose feed fragment (windows)
        if: runner.os == 'Windows'
        env:
          TAG: ${{ needs.build.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          EXE="$RELEASE_DIR/Mark_${VER}_x64-setup.exe"
          test -f "$EXE"
          node node_modules/@tauri-apps/cli/tauri.js signer sign "$EXE"
          test -f "$EXE.sig"
          SIG=$(cat "$EXE.sig")
          cat > "$RELEASE_DIR/latest-platform.json" <<JSON
          {
            "platforms": {
              "windows-x86_64": {
                "signature": "${SIG}",
                "url": "https://updates.mark.xronocode.com/pkg/windows-x86_64/${VER}"
              }
            }
          }
          JSON
          for SIGNED in "$EXE" "$RELEASE_DIR/latest-platform.json"; do
            HASH=$(node -e "const c=require('crypto'),f=require('fs');process.stdout.write(c.createHash('sha256').update(f.readFileSync(process.argv[1])).digest('hex'))" "$SIGNED")
            echo "$HASH" > "$SIGNED.sha256"
          done
          cat "$RELEASE_DIR/latest-platform.json"

      # ── SLSA-3 build provenance (moved from build) ───────────────
      # C-RELEASE-SIGNING-SPLIT: provenance and keyless cosign now attest
      # the signed release set, issued from this job's OIDC authority.
      - name: SLSA build provenance
        if: runner.os == 'macOS'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: '/tmp/release/Mark_*.dmg'

      - name: SLSA build provenance (windows)
        if: runner.os == 'Windows'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: '${{ runner.temp }}\release\Mark_*_x64-setup.exe'

      # ── Cosign keyless sign-blob (moved from build) ──────────────
      # Belt-and-braces over the SLSA attestation: a keyless cosign
      # signature using the same OIDC → Fulcio path. Produces a
      # .bundle file users can verify with:
      #   cosign verify-blob \
      #     --bundle Mark_v2.0.0_aarch64.dmg.bundle \
      #     --certificate-identity-regexp 'https://github\.com/xronocode/mark/.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     Mark_v2.0.0_aarch64.dmg
      - name: install cosign
        if: runner.os == 'macOS'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: 'v2.4.1'

      - name: cosign sign-blob
        if: runner.os == 'macOS'
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          set -euo pipefail
          for DMG in /tmp/release/Mark_*.dmg; do
            cosign sign-blob --yes --bundle "$DMG.bundle" "$DMG"
            ls -la "$DMG.bundle"
          done

      - name: install cosign (windows)
        if: runner.os == 'Windows'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: 'v2.4.1'

      - name: cosign sign-blob (windows)
        if: runner.os == 'Windows'
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          set -euo pipefail
          shopt -s nullglob
          for EXE in "$RUNNER_TEMP"/release/Mark_*_x64-setup.exe; do
            cosign sign-blob --yes --bundle "$EXE.bundle" "$EXE"
            ls -la "$EXE.bundle"
          done

      # ── upload the signed set under the unchanged release names ──
      - name: upload signed release artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mark-${{ matrix.platform.name }}-release
          path: |
            /tmp/release/*.dmg
            /tmp/release/*.sha256
            /tmp/release/*.bundle
            /tmp/release/Mark_*_sbom-*.cdx.json
            /tmp/release/NOTICES-*.md
            /tmp/release/Mark_*.app.tar.gz
            /tmp/release/latest-platform.json
          if-no-files-found: error
          retention-days: 30

      - name: upload signed release artifacts (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mark-${{ matrix.platform.name }}-release
          path: |
            ${{ runner.temp }}\release\Mark_*_x64-setup.exe
            ${{ runner.temp }}\release\Mark_*_x64-setup.exe.sha256
            ${{ runner.temp }}\release\Mark_*_x64-setup.exe.bundle
            ${{ runner.temp }}\release\latest-platform.json
            ${{ runner.temp }}\release\latest-platform.json.sha256
          if-no-files-found: error
          retention-days: 30

  prepare-publication:
    name: prepare immutable publication bundle
    needs: [authorize-tag, build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: checkout exact release seal without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # C-RELEASE-SIGNING-SPLIT: consume only the signed set — the build
          # job's -staged handoff artifacts stay excluded so every release
          # asset still matches exactly one staged file.
          pattern: mark-*-release
          path: /tmp/release-stage

      - name: constrain staged platforms
        env:
          WINDOWS_RELEASE: ${{ vars.WINDOWS_RELEASE }}
        run: |
          set -euo pipefail
          if [ "$WINDOWS_RELEASE" != true ]; then
            rm -rf /tmp/release-stage/mark-windows-x64-release
            echo 'windows assets: build-only'
          else
            echo 'windows assets: included'
          fi

      - name: compose deterministic updater feed
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          PUB_DATE=$(git show -s --format=%cI "$TAG^{commit}")
          FRAGS=()
          while IFS= read -r frag; do FRAGS+=("$frag"); done < <(find /tmp/release-stage -name latest-platform.json | sort)
          [ "${#FRAGS[@]}" -gt 0 ]
          jq -s --arg ver "$VER" --arg tag "$TAG" --arg date "$PUB_DATE" \
            '{version:$ver, notes:("See release notes at https://github.com/xronocode/mark/releases/tag/"+$tag), pub_date:$date, platforms:(map(.platforms) | add)}' \
            "${FRAGS[@]}" > /tmp/release-stage/latest.json
          rm -f "${FRAGS[@]}"
          MAC_DIR=/tmp/release-stage/mark-macos-arm64-release
          test -d "$MAC_DIR"
          mv /tmp/release-stage/latest.json "$MAC_DIR/latest.json"

      - name: assemble exact asset inventory
        env:
          TAG: ${{ needs.build.outputs.tag }}
          WINDOWS_RELEASE: ${{ vars.WINDOWS_RELEASE }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          ASSETS=/tmp/release-assets
          mkdir -p "$ASSETS"
          copy_one() {
            NAME=$1
            MATCHES=()
            while IFS= read -r match; do MATCHES+=("$match"); done < <(find /tmp/release-stage -type f -name "$NAME")
            [ "${#MATCHES[@]}" = 1 ] || { echo "::error::expected exactly one $NAME"; exit 1; }
            cp "${MATCHES[0]}" "$ASSETS/$NAME"
          }
          for NAME in \
            "Mark_${VER}_aarch64.dmg" \
            "Mark_${VER}_aarch64.dmg.sha256" \
            "Mark_${VER}_aarch64.dmg.bundle" \
            "Mark_${VER}_aarch64.app.tar.gz" \
            "Mark_${VER}_sbom-node.cdx.json" \
            "Mark_${VER}_sbom-rust.cdx.json" \
            NOTICES-node.md NOTICES-rust.md latest.json
          do
            copy_one "$NAME"
          done
          if [ "$WINDOWS_RELEASE" = true ]; then
            for NAME in "Mark_${VER}_x64-setup.exe" "Mark_${VER}_x64-setup.exe.sha256" "Mark_${VER}_x64-setup.exe.bundle"; do
              copy_one "$NAME"
            done
          fi
          # integration f-006: every inventory asset must carry real content —
          # a zero-byte file is a broken handoff, not a releasable asset.
          # Fail closed here, before the owner-approval gate.
          for FILE in "$ASSETS"/*; do
            if [ ! -s "$FILE" ]; then
              echo "::error::inventory asset is empty: $(basename "$FILE")"
              exit 1
            fi
          done
          # integration f-006: the digest manifest is publication bookkeeping,
          # not release content — it lives beside the body, outside the asset
          # dir, so the draft receives exactly the named inventory (pre-fix it
          # sat inside and shipped as an extra draft asset).
          (cd "$ASSETS" && sha256sum -- * > "${ASSETS}.sha256")
          jq -e --arg version "$VER" '.version == $version and (.platforms["darwin-aarch64"] != null)' "$ASSETS/latest.json" >/dev/null

      - name: render reviewed release body without write credentials
        env:
          TAG: ${{ needs.build.outputs.tag }}
          WINDOWS_RELEASE: ${{ vars.WINDOWS_RELEASE }}
          PRERELEASE: ${{ needs.authorize-tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          if [ "$PRERELEASE" = true ]; then
            # C-RELEASE-CANARY-PRERELEASE: prerelease bodies carry the
            # automated verification block and a tester notice only — no
            # reviewed notes, no What's New materials, no brew line.
            cat > /tmp/release-body.md <<NOTES_EOF
          Automated prerelease from \`$GITHUB_SHA\`.

          **Prerelease build for external testers.** Install by downloading the assets below over your existing installation; roll back by reinstalling the latest stable DMG. This build is not published to the in-app updater feed, Homebrew or winget.

          **Verification:**

          Build provenance (SLSA-3):
          \`\`\`
          gh attestation verify Mark_${VER}_aarch64.dmg --owner xronocode
          \`\`\`

          Cosign keyless signature:
          \`\`\`
          cosign verify-blob --bundle Mark_${VER}_aarch64.dmg.bundle Mark_${VER}_aarch64.dmg
          \`\`\`

          DMG SHA-256, CycloneDX SBOMs, attribution notices, and the ed25519-signed updater feed are published as release assets.
          NOTES_EOF
            if [ "$WINDOWS_RELEASE" = true ]; then
              printf "\n**Windows (x64):** NSIS installer \`Mark_%s_x64-setup.exe\` is attached for direct download (not in the updater feed).\n" "$VER" >> /tmp/release-body.md
            fi
            exit 0
          fi
          cat > /tmp/automated-release-body.md <<NOTES_EOF
          Automated release from \`$GITHUB_SHA\`.

          **Verification:**

          Build provenance (SLSA-3):
          \`\`\`
          gh attestation verify Mark_${VER}_aarch64.dmg --owner xronocode
          \`\`\`

          Cosign keyless signature:
          \`\`\`
          cosign verify-blob --bundle Mark_${VER}_aarch64.dmg.bundle Mark_${VER}_aarch64.dmg
          \`\`\`

          DMG SHA-256, CycloneDX SBOMs, attribution notices, and the ed25519-signed updater feed are published as release assets.

          \`\`\`
          brew upgrade --cask mark
          \`\`\`
          NOTES_EOF
          if [ "$WINDOWS_RELEASE" = true ]; then
            printf "\n**Windows (x64):** NSIS installer \`Mark_%s_x64-setup.exe\` is included in the updater feed.\n" "$VER" >> /tmp/automated-release-body.md
          fi
          node tools/release-notes.mjs --tag "$TAG" --automated-body /tmp/automated-release-body.md > /tmp/release-body.md

      - name: seal publication bundle
        run: |
          set -euo pipefail
          (cd /tmp && sha256sum release-body.md release-assets.sha256 release-assets/* > publication.sha256)

      - name: upload publication bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-publication-${{ needs.build.outputs.tag }}
          path: |
            /tmp/release-assets
            /tmp/release-body.md
            /tmp/publication.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish github release
    needs: [authorize-tag, build, prepare-publication]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # C-RELEASE-MANUAL-PUBLISH: publication is manual-only (owner train
    # rule 1, 2026-10-26). The release-authorize approval created the tag
    # (the first explicit owner instruction); this synchronous release
    # environment approval is the second, final one — it fires after the
    # build lanes are green, and the release goes live only after the
    # owner approves. The wait does not consume the job timeout.
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - name: download immutable publication bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-publication-${{ needs.build.outputs.tag }}
          path: /tmp/publication

      - name: verify publication bundle digest
        run: |
          set -euo pipefail
          cd /tmp/publication
          sha256sum -c publication.sha256

      - name: reconcile and verify draft or exact public release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          ASSETS=/tmp/publication/release-assets
          BODY=/tmp/publication/release-body.md
          ALREADY_PUBLISHED=false
          RELEASE_JSON=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId,isDraft 2>/dev/null || true)
          if [ -n "$RELEASE_JSON" ]; then
            RELEASE_ID=$(jq -r .databaseId <<<"$RELEASE_JSON")
            DRAFT=$(jq -r .isDraft <<<"$RELEASE_JSON")
            if [ "$DRAFT" = true ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$BODY"
            else
              ALREADY_PUBLISHED=true
            fi
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Mark $TAG" --notes-file "$BODY"
            RELEASE_ID=
            for ATTEMPT in 1 2 3 4 5; do
              RELEASE_ID=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId 2>/dev/null || true)
              [ -n "$RELEASE_ID" ] && break
              [ "$ATTEMPT" = 5 ] && { echo "::error::release draft was not readable after creation"; exit 1; }
              sleep $((ATTEMPT * 2))
            done
          fi
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          if [ "$ALREADY_PUBLISHED" = false ]; then
            for FILE in "$ASSETS"/*; do
              NAME=$(basename "$FILE")
              # integration f-006: fail closed at the emission point — an
              # empty asset never reaches the draft (the publication digest
              # pins the bytes upstream; this guards the emission itself).
              if [ ! -s "$FILE" ]; then
                echo "::error::[ReleasePublish][publish][BLOCK_RELEASE_EMPTY_ASSET] $NAME is empty"
                exit 1
              fi
              ASSET_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --paginate --jq ".[] | select(.name == \"$NAME\") | .id")
              if [ -n "$ASSET_ID" ]; then
                gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" > "/tmp/server-$NAME"
                cmp "$FILE" "/tmp/server-$NAME" || { echo "::error::existing draft asset differs: $NAME"; exit 1; }
              else
                gh release upload "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY"
              fi
            done
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > /tmp/release-readback.json
          jq -je '.body' /tmp/release-readback.json > /tmp/server-body.md
          cmp "$BODY" /tmp/server-body.md
          find "$ASSETS" -maxdepth 1 -type f -exec basename {} \; | sort > /tmp/expected-assets.txt
          jq -er '.assets[].name' /tmp/release-readback.json | sort > /tmp/server-assets.txt
          diff -u /tmp/expected-assets.txt /tmp/server-assets.txt
          mkdir /tmp/release-readback
          while read -r NAME; do
            # Same draft caveat: fetch each asset by its id from the
            # readback instead of gh release download's tag lookup.
            ASSET_URL=$(jq -r --arg name "$NAME" '.assets[] | select(.name == $name) | .url' /tmp/release-readback.json)
            [ -n "$ASSET_URL" ] || { echo "::error::asset missing from readback: $NAME"; exit 1; }
            gh api -H 'Accept: application/octet-stream' "$ASSET_URL" > "/tmp/release-readback/$NAME"
          done < /tmp/expected-assets.txt
          # integration f-006: the relocated manifest (beside the body).
          (cd /tmp/release-readback && sha256sum -c "${ASSETS}.sha256")
          cmp "$ASSETS/latest.json" /tmp/release-readback/latest.json
          echo "already_published=$ALREADY_PUBLISHED" >> "$GITHUB_OUTPUT"

      - name: publish verified draft as final mutation
        if: steps.draft.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.authorize-tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = true ]; then
            # C-RELEASE-CANARY-PRERELEASE: a prerelease is exposed as a
            # GitHub prerelease and must never become releases/latest —
            # the in-app updater feed stays on the previous stable tag.
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=true
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName \
              | jq -e --arg tag "$TAG" 'select(.isDraft == false and .isPrerelease == true and .tagName == $tag)' >/dev/null
            for ATTEMPT in 1 2 3 4 5; do
              LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
              [ "$LATEST" != "$TAG" ] && break
              [ "$ATTEMPT" = 5 ] && { echo "::error::prerelease must not advance releases/latest"; exit 1; }
              sleep $((ATTEMPT * 3))
            done
            echo "[ReleasePublish][publish][BLOCK_RELEASE_PRERELEASE_NOT_LATEST] tag=$TAG"
            exit 0
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName \
            | jq -e --arg tag "$TAG" 'select(.isDraft == false and .isPrerelease == false and .tagName == $tag)' >/dev/null
          # The in-app updater reads releases/latest: a release is live only
          # once that feed advances to this tag.
          for ATTEMPT in 1 2 3 4 5; do
            LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
            [ "$LATEST" = "$TAG" ] && break
            [ "$ATTEMPT" = 5 ] && { echo "::error::latest release feed did not advance to $TAG"; exit 1; }
            sleep $((ATTEMPT * 3))
          done
          echo "[ReleasePublish][publish][BLOCK_RELEASE_LATEST_ADVANCED] tag=$TAG"

      - name: verify update channel on republish
        # Guard-audit integration f-007: a republish of an
        # already-published release skips the final mutation above, so the
        # in-app updater feed (releases/latest) must be asserted
        # explicitly — the per-tag concurrency stays, no mutation happens,
        # and an older tag still holding the channel fails the run loudly
        # instead of passing.
        if: steps.draft.outputs.already_published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.authorize-tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = true ]; then
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName \
              | jq -e --arg tag "$TAG" 'select(.isDraft == false and .isPrerelease == true and .tagName == $tag)' >/dev/null
            for ATTEMPT in 1 2 3 4 5; do
              LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
              [ "$LATEST" != "$TAG" ] && break
              [ "$ATTEMPT" = 5 ] && { echo "::error::prerelease must not advance releases/latest"; exit 1; }
              sleep $((ATTEMPT * 3))
            done
            echo "[ReleasePublish][republish][BLOCK_RELEASE_PRERELEASE_NOT_LATEST] tag=$TAG"
            exit 0
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName \
            | jq -e --arg tag "$TAG" 'select(.isDraft == false and .isPrerelease == false and .tagName == $tag)' >/dev/null
          # The in-app updater reads releases/latest: an already-live
          # republish is honest only while the feed points at this tag.
          for ATTEMPT in 1 2 3 4 5; do
            LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
            [ "$LATEST" = "$TAG" ] && break
            [ "$ATTEMPT" = 5 ] && { echo "::error::latest release feed does not point at $TAG"; exit 1; }
            sleep $((ATTEMPT * 3))
          done
          echo "[ReleasePublish][republish][BLOCK_RELEASE_LATEST_ADVANCED] tag=$TAG"

  publish-cask:
    name: cross-repo cask PR
    needs: [authorize-tag, build, publish]
    # C-RELEASE-CANARY-PRERELEASE: prereleases never reach the Homebrew
    # cask; the stable path keeps its unchanged handoff.
    if: needs.authorize-tag.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-cask
    permissions:
      contents: read
    # B4 step-15: cross-repo PR via xronocode-release-bot GitHub App.
    # The App's installation token has contents:write on
    # xronocode/homebrew-mark and pull-requests:write to open the bump
    # PR. Missing credentials fail explicitly. While workflow artifacts
    # are retained, `gh run rerun --failed` retries this idempotent job
    # without retagging, rebuilding, or republishing the release.
    steps:
      - name: checkout reborn-mark
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: download signed macOS release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # C-RELEASE-CASK-SIGNED-DIGEST: the cask digest is resolved only
          # from the signed macOS release artifact — the broad all-artifact
          # download let the digest selection below pick the unsigned staged
          # sidecar.
          name: mark-macos-arm64-release
          path: /tmp/release-stage/mark-macos-arm64-release

      - name: gate on App secrets
        env:
          CASK_BOT_APP_ID: ${{ secrets.CASK_BOT_APP_ID }}
          CASK_BOT_PRIVATE_KEY: ${{ secrets.CASK_BOT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$CASK_BOT_APP_ID"
          test -n "$CASK_BOT_PRIVATE_KEY"

      - name: mint app installation token
        id: app_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          # Symbolic GitHub secret lookups only; credential bytes are stored in the release-cask Environment, never in source.
          app-id: ${{ secrets.CASK_BOT_APP_ID }}
          private-key: ${{ secrets.CASK_BOT_PRIVATE_KEY }}
          owner: xronocode
          repositories: homebrew-mark
          permission-contents: write
          permission-pull-requests: write

      - name: open cask bump PR
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"

          # C-RELEASE-CASK-SIGNED-DIGEST: address the sidecar by its explicit
          # artifact path — no find/head selection over the staged tree
          # remains, so the unsigned staged copy can never be picked.
          CASK_SIDECAR="/tmp/release-stage/mark-macos-arm64-release/Mark_${VER}_aarch64.dmg.sha256"
          SIGNED_DMG="/tmp/release-stage/mark-macos-arm64-release/Mark_${VER}_aarch64.dmg"
          if [ ! -f "$CASK_SIDECAR" ] || [ ! -f "$SIGNED_DMG" ]; then
            echo "::error::signed DMG or its .sha256 sidecar missing for $TAG"
            exit 1
          fi
          # Pull the .sha256 sidecar value (NOT recompute) per B2CR-3.
          SHA256=$(awk '{print $1}' < "$CASK_SIDECAR")
          # Coherence check only: the recomputed hash is never substituted
          # into the cask — a sidecar that disagrees with the signed DMG
          # beside it fails the run before any cask mutation.
          COMPUTED=$(sha256sum "$SIGNED_DMG" | awk '{print $1}')
          if [ "$SHA256" != "$COMPUTED" ]; then
            echo "::error::[ReleaseCask][publish-cask][BLOCK_RELEASE_CASK_DIGEST_MISMATCH] sidecar $SHA256 != computed $COMPUTED for $TAG"
            exit 1
          fi

          # Configure git to use the GH App token via gh's credential
          # helper. Without this, `git push` falls through to the default
          # askpass and fails: "could not read Username for github.com".
          gh auth setup-git

          # Clone tap, bump, push, open PR.
          gh repo clone xronocode/homebrew-mark /tmp/tap -- --depth 1
          cd /tmp/tap

          git config user.name 'xronocode-release-bot[bot]'
          git config user.email 'xronocode-release-bot[bot]@users.noreply.github.com'

          # Select cask file: alpha tags → mark@alpha.rb, stable → mark.rb
          if echo "$VER" | grep -q 'alpha'; then
            CASK="Casks/mark@alpha.rb"
            CASK_NAME="mark@alpha"
          else
            CASK="Casks/mark.rb"
            CASK_NAME="mark"
          fi

          BRANCH="bump/${CASK_NAME}-${VER}"
          TITLE="Bump ${CASK_NAME} to ${VER}"
          EXPECTED_CASK_PR_AUTHOR='app/xronocode-cask-bot'
          EXISTING=$(gh pr list --repo xronocode/homebrew-mark --state all --head "xronocode:$BRANCH" --json number,title,headRefName,baseRefName,state,isDraft,author --limit 2)
          COUNT=$(jq 'length' <<<"$EXISTING")
          if [ "$COUNT" = 1 ]; then
            jq -e --arg title "$TITLE" --arg branch "$BRANCH" --arg author "$EXPECTED_CASK_PR_AUTHOR" \
              '.[0] | select(.title == $title and .headRefName == $branch and .baseRefName == "main" and .isDraft == false and .author.login == $author)' \
              <<<"$EXISTING" >/dev/null
            PR_NUMBER=$(jq -r '.[0].number' <<<"$EXISTING")
            PR_STATE=$(jq -r '.[0].state' <<<"$EXISTING")
            if [ "$PR_STATE" = MERGED ]; then
              gh api "repos/xronocode/homebrew-mark/contents/$CASK?ref=main" \
                -H 'Accept: application/vnd.github.raw+json' > /tmp/cask-main.rb
              grep -Fxq "  version \"$VER\"" /tmp/cask-main.rb
              grep -Fxq "  sha256 \"$SHA256\"" /tmp/cask-main.rb
              echo "exact cask PR already merged for $TAG"
              exit 0
            fi
            [ "$PR_STATE" = OPEN ]
            echo "exact cask PR already open for $TAG"
          elif [ "$COUNT" = 0 ]; then
            # cicd f-009: a previous run may have pushed the bump branch and
            # died before `gh pr create`. COUNT = 0 means no PR in ANY state
            # carries this head (`--state all` already proved it), so the
            # branch is an orphan of this same bot flow — delete it and fall
            # through to the fresh create below, so the documented idempotent
            # rerun (`gh run rerun --failed`) completes the handoff
            # end-to-end instead of stalling here forever.
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
              git push origin --delete "$BRANCH"
            fi
            git checkout -b "$BRANCH"

            sed -i'' -e "s|version \".*\"|version \"$VER\"|" "$CASK"
            sed -i'' -e "s|sha256 \"[a-f0-9]*\"|sha256 \"$SHA256\"|" "$CASK"

            # The Tauri release contract publishes Mark_<version>_aarch64.dmg.
            EXPECTED_DMG_TEMPLATE='Mark_#{version}_aarch64.dmg'
            if ! grep -Fq "$EXPECTED_DMG_TEMPLATE" "$CASK"; then
              echo "::error::$CASK URL must reference $EXPECTED_DMG_TEMPLATE"
              exit 1
            fi

            git add "$CASK"
            git commit -m "$TITLE"
            git push origin "$BRANCH"

            PR_URL=$(gh pr create \
              --repo xronocode/homebrew-mark \
              --title "$TITLE" \
              --body "Auto-generated by release.yml on tag ${TAG}.

            - DMG sha256 sourced verbatim from Mark_${VER}_aarch64.dmg.sha256 sidecar.
            - SLSA-3 attestation + Cosign bundle published with the release.
            - Smoke launch + warnings allowlist passed in CI.

            The repository-owned cask/validate check must pass before automatic merge." \
              --base main \
              --head "$BRANCH")
            PR_NUMBER=$(gh pr view "$PR_URL" --repo xronocode/homebrew-mark --json number --jq .number)
          else
            echo "::error::ambiguous cask PR identity for $TAG"
            exit 1
          fi

          PR=$(gh pr view "$PR_NUMBER" --repo xronocode/homebrew-mark --json number,title,headRefName,baseRefName,state,isDraft,author)
          jq -e --arg title "$TITLE" --arg branch "$BRANCH" --arg author "$EXPECTED_CASK_PR_AUTHOR" \
            'select(.title == $title and .headRefName == $branch and .baseRefName == "main" and .state == "OPEN" and .isDraft == false and .author.login == $author)' \
            <<<"$PR" >/dev/null
          gh pr merge "$PR_NUMBER" --repo xronocode/homebrew-mark --auto --squash --delete-branch
