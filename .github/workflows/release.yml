# FILE: .github/workflows/release.yml
# VERSION: 2.4.0
# START_MODULE_CONTRACT
#   PURPOSE: Admit only an approved annotated release tag, build and sign its exact Ready seal, then stage and publish one digest-verified draft release after a separate owner approval.
#   SCOPE: Input-free manual unsigned QA builds plus tag-only readiness, signing, notarization, artifact verification, draft-first GitHub publication, and downstream Homebrew handoff.
#   DEPENDS: M-046 release readiness/materials/preflight, Node 22, Rust stable, Playwright Chromium, tauri-action, tag-restricted release-signing secrets, GitHub OIDC, release environment.
#   LINKS: .grace/graph/features.xml M-046; .grace/verification/features.xml V-M-046.
#   ROLE: CONFIG
#   MAP_MODE: SUMMARY
# END_MODULE_CONTRACT
#
# START_MODULE_MAP
#   authorize-tag - Reject any non-bot, lightweight, wrong-target, stale-check, or non-Ready release tag before secrets or candidate code execute.
#   manual-build - Run unsigned build-only QA from an input-free manual dispatch.
#   build - Re-run readiness, create signed/notarized release artifacts, and enforce smoke/supply-chain gates inside release-signing.
#   prepare-publication - Render and digest the exact release body and asset set without write credentials.
#   publish - Reconcile and verify an immutable asset set on a draft, then expose it only as the final release-environment step.
#   close-release-please - Verify the public latest release and close the exact merged Release Please PR lifecycle with narrow metadata permissions.
#   publish-cask - Open or verify the exact downstream Homebrew cask update and schedule its required-check-gated auto-merge.
# END_MODULE_MAP
#
# START_CHANGE_SUMMARY
#   - 2026-10-21 v2.4.0: require the exact cask-bot PR identity, accept an already-merged exact cask as idempotent success, and schedule squash auto-merge behind the tap's required validation check.
#   - 2026-10-21 v2.3.1: bind a newly created draft by database ID with bounded retry before asset reconciliation and read-back.
#   - 2026-10-21 v2.3.0: restore the remote annotated tag object after checkout rewrites the local tag ref to its peeled commit.
#   - 2026-10-20 v2.2.0: isolate Release Please metadata permissions from publication, compare release notes byte-for-byte, and document rerunnable cask handoff.
#   - 2026-10-20 v2.1.0: separate privileged publication preparation, make updater metadata deterministic, narrow platform secrets, and add idempotent publication recovery.
#   - 2026-10-20 v2.0.0: require the owner-approved bot tag and Ready seal, isolate tag-only signing, keep manual runs unsigned, and publish only after draft asset/note/read-back verification.
#   - 2026-10-07 v1.7.1: fix compose-latest.json — the bash builtin is
#     lowercase `mapfile`; `MAPFILE` was command-not-found (exit 127) the
#     first time the merge path ran with WINDOWS_RELEASE=true (v2.2.0-beta
#     run 37575470738; both build lanes were green).
#   - 2026-09-28 v1.7.0: C-15 T-W3 — windows-x64 (NSIS, x86_64-pc-windows-msvc) build lane: CI silent-install smoke, per-platform updater-feed fragments merged in publish, Windows assets staged behind vars.WINDOWS_RELEASE (build-only until manual QA passes); literal macos-14 gates refactored to runner.os.
#   - 2026-08-07 v1.6.0: publish signed beta tags as GitHub latest releases so the configured /releases/latest updater endpoint advances.
#   - 2026-08-07 v1.5.0: fail cask publication unless its URL template resolves to the staged Tauri DMG filename.
#   - 2026-08-07 v1.4.0: classify hyphenated SemVer tags as GitHub prereleases during create and idempotent update paths.
#   - 2026-08-07 v1.3.0: build the clean-checkout renderer before Playwright preview and bound the E2E release gate to 15 minutes.
#   - 2026-08-07 v1.2.0: emit strict SemVer without the Git tag's leading v in the Tauri updater feed.
#   - 2026-08-07 v1.1.0: gate v2.1.1-beta on exact metadata/tag parity, complete tests, strict codesign, and Gatekeeper assessment.
# END_CHANGE_SUMMARY
#
# Phase-B4 release workflow.
#
# Triggered by git tag push matching v*.* — produces Developer ID
# signed + Apple-notarized, smoke-tested DMG artifacts and publishes
# them as a GitHub Release with .sha256 sidecars.
#
# Apple code signing: tauri-action reads APPLE_CERTIFICATE (base64
# .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
# APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID from secrets. It imports
# the cert into a CI keychain, signs with Developer ID, submits to
# Apple notary, and staples the ticket — all before DMG packaging.

name: release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  authorize-tag:
    name: release/readiness
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      payload: ${{ steps.identity.outputs.payload }}
      seal: ${{ steps.identity.outputs.seal }}
    steps:
      - name: checkout exact tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: derive and validate immutable identity
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PUSH_ACTOR: ${{ github.actor }}
          EXPECTED_TAGGER: xronocode-release-bot[bot]
        run: |
          set -euo pipefail
          [ "$EVENT_NAME" = push ]
          [ "$REF_TYPE" = tag ]
          [ "$PUSH_ACTOR" = "$EXPECTED_TAGGER" ]
          node -e "if(!/^v(?:0|[1-9]\\d*)\\.(?:0|[1-9]\\d*)\\.(?:0|[1-9]\\d*)(?:-[0-9A-Za-z.-]+)?$/.test(process.env.REF_NAME))process.exit(1)"
          git fetch --force --no-tags origin "refs/tags/$REF_NAME:refs/tags/$REF_NAME"
          TAG_REF="refs/tags/$REF_NAME"
          [ "$(git cat-file -t "$TAG_REF")" = tag ]
          SEAL=$(git rev-parse "$TAG_REF^{commit}")
          HEAD_SHA=$(git rev-parse HEAD)
          [ "$HEAD_SHA" = "$SEAL" ]
          STATE=$(node -p "JSON.parse(require('fs').readFileSync('docs/release-trains/2.6.x-next.json')).state")
          PAYLOAD=$(node -p "JSON.parse(require('fs').readFileSync('docs/release-trains/2.6.x-next.json')).payloadSha")
          EXPECTED_TAG=v$(node -p "JSON.parse(require('fs').readFileSync('docs/release-trains/2.6.x-next.json')).computedVersion")
          [ "$STATE" = Ready ]
          [ "$REF_NAME" = "$EXPECTED_TAG" ]
          echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          echo "payload=$PAYLOAD" >> "$GITHUB_OUTPUT"
          echo "seal=$SEAL" >> "$GITHUB_OUTPUT"

      - name: install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: read exact payload check runs
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD: ${{ steps.identity.outputs.payload }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/commits/$PAYLOAD/check-runs?per_page=100" \
            | jq '[.[].check_runs[]] | sort_by(.started_at) | group_by(.name + "|" + .app.name) | map(last | {name, app:.app.name, sha:.head_sha, conclusion})' \
            > /tmp/release-checks.json

      - name: strict online release admission
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          PAYLOAD: ${{ steps.identity.outputs.payload }}
          SEAL: ${{ steps.identity.outputs.seal }}
          HEAD_SHA: ${{ github.sha }}
        run: npm run release:readiness -- --mode strict --tag "$TAG" --payload "$PAYLOAD" --seal "$SEAL" --head "$HEAD_SHA" --checks-file /tmp/release-checks.json

      - name: materials and version admission
        env:
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          npm run release:materials -- --tag "$TAG"
          npm run release:preflight -- --tag "$TAG"

      - name: preserve checked identity for packaging
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-identity
          path: /tmp/release-checks.json
          if-no-files-found: error
          retention-days: 1

  manual-build:
    name: unsigned QA build (${{ matrix.platform.name }})
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: read
    steps:
      - name: checkout selected commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: ${{ matrix.platform.target }}
      - name: unsigned build-only verification
        run: |
          npm ci
          npm run release:governance
          npm run typecheck:ipc
          npm test
          npm run build
          cargo test --bin mark --manifest-path src-tauri/Cargo.toml
          npm run tauri:build -- --target "${{ matrix.platform.target }}"

  build:
    name: build (${{ matrix.platform.name }})
    needs: authorize-tag
    if: github.event_name == 'push' && needs.authorize-tag.result == 'success'
    environment: release-signing
    permissions:
      contents: read
      checks: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
          # C-15 T-W3: Windows lane — NSIS x64 installer + updater
          # artifacts. Windows release assets are staged behind the
          # WINDOWS_RELEASE repo variable (see the publish job): until it
          # is set, the exe is a workflow artifact for manual QA only.
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    # bash on both OSes: the runner scripts below are POSIX; Windows
    # runners resolve bash via Git for Windows. PowerShell is opted into
    # per-step via `shell: pwsh` where native tooling demands it.
    defaults:
      run:
        shell: bash

    outputs:
      tag: ${{ steps.resolve_tag.outputs.tag }}

    steps:
      # ── checkout + tooling ────────────────────────────────────────
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: resolve tag
        id: resolve_tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ]; then
            echo "::error::could not resolve tag from the pushed tag ref"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "resolved tag: $TAG"

      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: setup rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: ${{ matrix.platform.target }}

      - name: cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ matrix.platform.target }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src-tauri/src/**/*.rs') }}
          restore-keys: |
            cargo-${{ matrix.platform.target }}-${{ hashFiles('**/Cargo.lock') }}-
            cargo-${{ matrix.platform.target }}-

      - name: download admitted check evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-identity
          path: ${{ runner.temp }}/release-identity

      # ── install + build frontend ─────────────────────────────────
      - name: npm ci
        run: npm ci

      - name: repeat strict release admission before packaging
        env:
          TAG: ${{ needs.authorize-tag.outputs.tag }}
          PAYLOAD: ${{ needs.authorize-tag.outputs.payload }}
          SEAL: ${{ needs.authorize-tag.outputs.seal }}
          HEAD_SHA: ${{ github.sha }}
          CHECKS_FILE: ${{ runner.temp }}/release-identity/release-checks.json
        run: npm run release:readiness -- --mode strict --tag "$TAG" --payload "$PAYLOAD" --seal "$SEAL" --head "$HEAD_SHA" --checks-file "$CHECKS_FILE"

      - name: release materials gate
        env:
          TAG: ${{ needs.authorize-tag.outputs.tag }}
        run: npm run release:materials -- --tag "$TAG"

      - name: release metadata preflight
        env:
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: npm run release:preflight -- --tag "$TAG"

      - name: renderer IPC typecheck
        run: npm run typecheck:ipc

      - name: renderer unit tests
        run: npm test

      - name: vite build
        run: npm run build

      - name: install Playwright Chromium
        if: runner.os == 'macOS'
        run: npx playwright install chromium

      # C-15 T-W3: renderer E2E stays macOS-gated until observed green on
      # a Windows runner; renderer-unit + Rust tests run on both lanes.
      - name: renderer E2E tests
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: npm run test:e2e

      - name: Rust unit tests
        run: cargo test --bin mark --manifest-path src-tauri/Cargo.toml

      # ── tauri build (Developer ID + updater signing) ─────────────
      # APPLE_* env vars → tauri-action imports .p12, signs with
      # Developer ID, submits to Apple notary, staples ticket.
      # TAURI_SIGNING_PRIVATE_KEY → ed25519 updater signature.
      - name: tauri build (macOS signed and notarized)
        if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: --target ${{ matrix.platform.target }}

      - name: tauri build (Windows updater-signed only)
        if: runner.os == 'Windows'
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.platform.target }}

      - name: verify signed and notarized app
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP_PATH=$(find target -path '*/release/bundle/macos/Mark.app' -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::signed Mark.app not found"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      # ── smoke launch ─────────────────────────────────────────────
      - name: smoke launch
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          DMG=$(find target -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::no .dmg artifact produced"
            exit 1
          fi
          MOUNT=/tmp/mark-dmg
          mkdir -p "$MOUNT"
          hdiutil attach "$DMG" -nobrowse -mountpoint "$MOUNT" -readonly
          cp -R "$MOUNT/Mark.app" /Applications/
          hdiutil detach "$MOUNT"
          open -a /Applications/Mark.app
          for i in $(seq 1 10); do
            if pgrep -f 'Mark.app/Contents/MacOS/mark' > /dev/null; then
              echo "alive after ${i}s"
              break
            fi
            sleep 1
          done
          if ! pgrep -f 'Mark.app/Contents/MacOS/mark' > /dev/null; then
            echo "::error::Mark process did not appear within 10s of open"
            exit 1
          fi
          pkill -9 -f 'Mark.app/Contents/MacOS/mark' || true

      # ── bundle size budget ───────────────────────────────────────
      - name: bundle size
        if: runner.os == 'macOS'
        id: size
        run: |
          set -euo pipefail
          APP_PATH=/Applications/Mark.app
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find target -name 'Mark.app' -type d | head -1)
          fi
          BYTES=$(du -sk "$APP_PATH" | awk '{print $1*1024}')
          HUMAN=$(du -sh "$APP_PATH" | awk '{print $1}')
          echo "bundle_bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "bundle_human=$HUMAN" >> "$GITHUB_OUTPUT"
          {
            echo "## Bundle size — ${{ matrix.platform.name }}"
            echo
            echo "- \`du -sh\`: **$HUMAN**"
            echo "- bytes: $BYTES"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── warnings allowlist ───────────────────────────────────────
      - name: warnings allowlist check
        if: runner.os == 'macOS'
        run: |
          set -uo pipefail  # NOT -e so we can show JSON before failing
          cd src-tauri
          cargo build --release --bin mark --message-format=json > /tmp/cargo.json
          cd ..
          node tools/check-warnings-allowlist.mjs /tmp/cargo.json docs/ci-warnings-allowlist.md \
            | tee /tmp/toolchain-warnings.json
          RC=${PIPESTATUS[0]}
          echo "---"
          echo "verifier exit code: $RC"
          exit $RC

      # ── attribution-completeness gate (B4 step-9) ────────────────
      # Re-runs license-checker + cargo-bundle-licenses, diffs against
      # committed NOTICES-{node,rust}.md. New deps without an attribution
      # line fail the build.
      - name: install cargo-bundle-licenses
        if: runner.os == 'macOS'
        run: cargo install cargo-bundle-licenses --version 4.2.0 --locked

      - name: verify attributions
        if: runner.os == 'macOS'
        run: ./tools/verify-attributions.sh

      # ── SBOM generation (B4 step-9) ──────────────────────────────
      # CycloneDX SPDX-compatible SBOM for the Tauri binary + Node
      # renderer dependency closure. Published alongside the DMG so
      # downstream auditors can verify the supply chain.
      - name: install cargo-cyclonedx
        if: runner.os == 'macOS'
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: generate SBOM
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p sbom
          # Node side: production deps only
          npx --yes --package @cyclonedx/cyclonedx-npm@6.0.1 -- cyclonedx-npm \
            --output-format JSON \
            --output-file sbom/sbom-node.cdx.json \
            --omit dev \
            --ignore-npm-errors
          # Rust side — cargo-cyclonedx 0.5.x writes <crate>.cdx.json
          # to the manifest directory; we relocate to sbom/.
          (cd src-tauri && cargo cyclonedx --format json)
          mv src-tauri/mark.cdx.json sbom/sbom-rust.cdx.json
          ls -la sbom/

      # ── updater feed fragment (B4 step-5, C-15 T-W3) ────────────
      # Each build lane emits a per-platform fragment; the publish job
      # merges every staged fragment into one latest.json (darwin-aarch64
      # required, windows-x86_64 optional). If signing keys aren't
      # provisioned, the .sig file is missing and the lane skips its
      # fragment (graceful degradation).
      - name: build updater feed fragment (macos)
        if: runner.os == 'macOS'
        id: feed
        env:
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          SIG_FILE=$(find target -name '*.app.tar.gz.sig' | head -1)
          TGZ_FILE=$(find target -name '*.app.tar.gz' ! -name '*.sig' | head -1)
          if [ -z "$SIG_FILE" ] || [ -z "$TGZ_FILE" ]; then
            echo "::warning::updater signing artifacts missing; latest.json not generated. Configure TAURI_SIGNING_PRIVATE_KEY+_PASSWORD secrets per docs/F-UPDATER-WIRE-PLUGIN-handoff.md."
            echo "skipped=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SIG=$(cat "$SIG_FILE")
          mkdir -p /tmp/release
          # Copy the .app.tar.gz so it gets uploaded as a release asset.
          cp "$TGZ_FILE" "/tmp/release/Mark_${VER}_aarch64.app.tar.gz"
          cat > /tmp/release/latest-platform.json <<JSON
          {
            "platforms": {
              "darwin-aarch64": {
                "signature": "${SIG}",
                "url": "https://github.com/xronocode/mark/releases/download/${TAG}/Mark_${VER}_aarch64.app.tar.gz"
              }
            }
          }
          JSON
          echo "skipped=0" >> "$GITHUB_OUTPUT"
          cat /tmp/release/latest-platform.json

      # ── stage release artifacts ──────────────────────────────────
      # Per B2CR-3: the cask sources sha256 from a .sha256 sidecar that
      # ships with the DMG, NOT a recomputed value. CI emits the sidecar
      # so the cask formula and the release artifact agree.
      - name: stage release artifacts
        if: runner.os == 'macOS'
        id: stage
        env:
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          DMG_SRC=$(find target -name '*.dmg' | head -1)
          if [ -z "$DMG_SRC" ]; then
            echo "::error::no .dmg artifact produced"
            exit 1
          fi
          # Strip leading 'v' from tag for filename version segment
          # (matches v1 cask convention: Mark_1.2.3_aarch64.dmg).
          VER=${TAG#v}
          DMG_DST=/tmp/release/Mark_${VER}_aarch64.dmg
          cp "$DMG_SRC" "$DMG_DST"
          shasum -a 256 "$DMG_DST" | awk '{print $1}' > "$DMG_DST.sha256"
          # B4-step-8 attribution + B4-step-9 SBOM artifacts shipped
          # alongside the DMG so downstream cask + audit consumers
          # don't need to re-clone the repo.
          cp NOTICES-node.md /tmp/release/
          cp NOTICES-rust.md /tmp/release/
          cp sbom/sbom-node.cdx.json /tmp/release/Mark_${VER}_sbom-node.cdx.json
          cp sbom/sbom-rust.cdx.json /tmp/release/Mark_${VER}_sbom-rust.cdx.json
          ls -la /tmp/release
          echo "dmg=$DMG_DST" >> "$GITHUB_OUTPUT"
          echo "sha256=$DMG_DST.sha256" >> "$GITHUB_OUTPUT"

      # ── Windows: smoke + size + feed fragment + stage (C-15 T-W3) ─
      # Smoke = silent NSIS install (/S), launch installed Mark.exe,
      # poll Get-Process, screenshot for the run log, then kill. The
      # GitHub windows runner session supports GUI app launches.
      - name: windows smoke (silent install + launch)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem -Recurse -Filter '*-setup.exe' -Path target |
            Where-Object { $_.Name -notlike '*.sig' } |
            Select-Object -First 1
          if (-not $setup) { throw '::error::no NSIS setup exe produced' }
          Write-Host "installer: $($setup.FullName)"

          # currentUser install mode → %LOCALAPPDATA%\Mark (fall back to
          # Program Files probe just in case the mode ever changes).
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = @(
            (Join-Path $env:LOCALAPPDATA 'Mark\Mark.exe')
            (Join-Path $env:ProgramFiles 'Mark\Mark.exe')
            (Join-Path ${env:ProgramFiles(x86)} 'Mark\Mark.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw '::error::Mark.exe not found after silent install' }
          Write-Host "installed: $exe"

          Start-Process -FilePath $exe
          $alive = $false
          foreach ($i in 1..20) {
            Start-Sleep -Seconds 1
            if (Get-Process -Name 'Mark' -ErrorAction SilentlyContinue) {
              $alive = $true
              Write-Host "alive after ${i}s"
              break
            }
          }
          if (-not $alive) { throw '::error::Mark process did not appear within 20s of launch' }

          # C-15 QA evidence: capture what the window actually looks like
          # (manual-QA feedback triage — layout overlap / maximize issues).
          # 10s: cold WebView2 on a fresh runner needs several seconds before
          # the renderer paints (3s captured a blank white window).
          Start-Sleep -Seconds 10
          try {
            New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\release" | Out-Null
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $ws = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $ws.Width, $ws.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($ws.Location, [System.Drawing.Point]::Empty, $ws.Size)
            $bmp.Save("$env:RUNNER_TEMP\release\app-screenshot.png")
            Write-Host "screenshot saved"
          } catch {
            Write-Host "screenshot failed: $_"
          }

          Stop-Process -Name 'Mark' -Force -ErrorAction SilentlyContinue

      - name: windows bundle size
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          EXE=$(find target -name '*-setup.exe' ! -name '*.sig' | head -1)
          if [ -z "$EXE" ]; then
            echo "::error::no NSIS setup exe produced"
            exit 1
          fi
          BYTES=$(wc -c < "$EXE" | tr -d ' ')
          HUMAN=$(( BYTES / 1024 / 1024 ))MB
          # Footprint positioning gate: the installer must stay small.
          if [ "$BYTES" -gt 20000000 ]; then
            echo "::error::windows installer exceeds the 20 MB footprint budget ($HUMAN, $BYTES bytes)"
            exit 1
          fi
          {
            echo "## Bundle size — ${{ matrix.platform.name }}"
            echo
            echo "- installer: **$HUMAN** ($BYTES bytes)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: build updater feed fragment (windows)
        if: runner.os == 'Windows'
        id: feed_win
        env:
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          SIG_FILE=$(find target -name '*-setup.exe.sig' | head -1)
          EXE_FILE=$(find target -name '*-setup.exe' ! -name '*.sig' | head -1)
          STAGE_DIR="$RUNNER_TEMP/release"
          mkdir -p "$STAGE_DIR"
          if [ -z "$SIG_FILE" ] || [ -z "$EXE_FILE" ]; then
            echo "::warning::windows updater artifacts missing; fragment not generated."
            echo "skipped=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SIG=$(cat "$SIG_FILE")
          cp "$EXE_FILE" "$STAGE_DIR/Mark_${VER}_x64-setup.exe"
          cat > "$STAGE_DIR/latest-platform.json" <<JSON
          {
            "platforms": {
              "windows-x86_64": {
                "signature": "${SIG}",
                "url": "https://github.com/xronocode/mark/releases/download/${TAG}/Mark_${VER}_x64-setup.exe"
              }
            }
          }
          JSON
          echo "skipped=0" >> "$GITHUB_OUTPUT"
          cat "$STAGE_DIR/latest-platform.json"

      - name: stage release artifacts (windows)
        if: runner.os == 'Windows'
        id: stage_win
        env:
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          STAGE_DIR="$RUNNER_TEMP/release"
          mkdir -p "$STAGE_DIR"
          EXE_DST="$STAGE_DIR/Mark_${VER}_x64-setup.exe"
          if [ ! -f "$EXE_DST" ]; then
            EXE_SRC=$(find target -name '*-setup.exe' ! -name '*.sig' | head -1)
            if [ -z "$EXE_SRC" ]; then
              echo "::error::no NSIS setup exe produced"
              exit 1
            fi
            cp "$EXE_SRC" "$EXE_DST"
          fi
          # node-based sha256 (shasum/perl availability differs on the
          # Windows image; node is guaranteed).
          HASH=$(node -e "const c=require('crypto'),f=require('fs');process.stdout.write(c.createHash('sha256').update(f.readFileSync(process.argv[1])).digest('hex'))" "$EXE_DST")
          echo "$HASH" > "$EXE_DST.sha256"
          ls -la "$STAGE_DIR"

      # ── upload as workflow artifact for downstream jobs ──────────
      # ── SLSA-3 build provenance (B4 step-11) ─────────────────────
      # actions/attest-build-provenance@v2 issues a Sigstore-anchored
      # in-toto attestation that proves the artifact was built by THIS
      # workflow run on THIS commit. OIDC → Fulcio → ephemeral cert →
      # signed bundle published to the GH Releases page alongside the
      # DMG. Verification command goes in release notes:
      #   gh attestation verify Mark_v2.0.0_aarch64.dmg --owner xronocode
      - name: SLSA build provenance
        if: runner.os == 'macOS'
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: '/tmp/release/Mark_*.dmg'

      - name: SLSA build provenance (windows)
        if: runner.os == 'Windows'
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: '${{ runner.temp }}\release\Mark_*_x64-setup.exe'

      # ── Cosign keyless sign-blob (B4 step-12) ────────────────────
      # Belt-and-braces over the SLSA attestation: a keyless cosign
      # signature using the same OIDC → Fulcio path. Produces a
      # .bundle file users can verify with:
      #   cosign verify-blob \
      #     --bundle Mark_v2.0.0_aarch64.dmg.bundle \
      #     --certificate-identity-regexp 'https://github\.com/xronocode/mark/.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     Mark_v2.0.0_aarch64.dmg
      - name: install cosign
        if: runner.os == 'macOS'
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        with:
          cosign-release: 'v2.4.1'

      - name: cosign sign-blob
        if: runner.os == 'macOS'
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          set -euo pipefail
          for DMG in /tmp/release/Mark_*.dmg; do
            cosign sign-blob --yes --bundle "$DMG.bundle" "$DMG"
            ls -la "$DMG.bundle"
          done

      - name: install cosign (windows)
        if: runner.os == 'Windows'
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        with:
          cosign-release: 'v2.4.1'

      - name: cosign sign-blob (windows)
        if: runner.os == 'Windows'
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          set -euo pipefail
          shopt -s nullglob
          for EXE in "$RUNNER_TEMP"/release/Mark_*_x64-setup.exe; do
            cosign sign-blob --yes --bundle "$EXE.bundle" "$EXE"
            ls -la "$EXE.bundle"
          done

      - name: upload release artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mark-${{ matrix.platform.name }}-release
          path: |
            /tmp/release/*.dmg
            /tmp/release/*.sha256
            /tmp/release/*.bundle
            /tmp/release/Mark_*_sbom-*.cdx.json
            /tmp/release/NOTICES-*.md
            /tmp/release/Mark_*.app.tar.gz
            /tmp/release/latest-platform.json
          if-no-files-found: error
          retention-days: 30

      # Always uploaded (also while WINDOWS_RELEASE is off) so the exe is
      # downloadable from the run page for manual QA on a real machine.
      - name: upload release artifacts (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mark-${{ matrix.platform.name }}-release
          path: ${{ runner.temp }}\release\*
          if-no-files-found: error
          retention-days: 30

  prepare-publication:
    name: prepare immutable publication bundle
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: checkout exact release seal without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/release-stage

      - name: constrain staged platforms
        env:
          WINDOWS_RELEASE: ${{ vars.WINDOWS_RELEASE }}
        run: |
          set -euo pipefail
          if [ "$WINDOWS_RELEASE" != true ]; then
            rm -rf /tmp/release-stage/mark-windows-x64-release
            echo 'windows assets: build-only'
          else
            echo 'windows assets: included'
          fi

      - name: compose deterministic updater feed
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          PUB_DATE=$(git show -s --format=%cI "$TAG^{commit}")
          mapfile -t FRAGS < <(find /tmp/release-stage -name latest-platform.json | sort)
          [ "${#FRAGS[@]}" -gt 0 ]
          jq -s --arg ver "$VER" --arg tag "$TAG" --arg date "$PUB_DATE" \
            '{version:$ver, notes:("See release notes at https://github.com/xronocode/mark/releases/tag/"+$tag), pub_date:$date, platforms:(map(.platforms) | add)}' \
            "${FRAGS[@]}" > /tmp/release-stage/latest.json
          rm -f "${FRAGS[@]}"
          MAC_DIR=/tmp/release-stage/mark-macos-arm64-release
          test -d "$MAC_DIR"
          mv /tmp/release-stage/latest.json "$MAC_DIR/latest.json"

      - name: assemble exact asset inventory
        env:
          TAG: ${{ needs.build.outputs.tag }}
          WINDOWS_RELEASE: ${{ vars.WINDOWS_RELEASE }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          ASSETS=/tmp/release-assets
          mkdir -p "$ASSETS"
          copy_one() {
            NAME=$1
            mapfile -t MATCHES < <(find /tmp/release-stage -type f -name "$NAME")
            [ "${#MATCHES[@]}" = 1 ] || { echo "::error::expected exactly one $NAME"; exit 1; }
            cp "${MATCHES[0]}" "$ASSETS/$NAME"
          }
          for NAME in \
            "Mark_${VER}_aarch64.dmg" \
            "Mark_${VER}_aarch64.dmg.sha256" \
            "Mark_${VER}_aarch64.dmg.bundle" \
            "Mark_${VER}_aarch64.app.tar.gz" \
            "Mark_${VER}_sbom-node.cdx.json" \
            "Mark_${VER}_sbom-rust.cdx.json" \
            NOTICES-node.md NOTICES-rust.md latest.json
          do
            copy_one "$NAME"
          done
          if [ "$WINDOWS_RELEASE" = true ]; then
            for NAME in "Mark_${VER}_x64-setup.exe" "Mark_${VER}_x64-setup.exe.sha256" "Mark_${VER}_x64-setup.exe.bundle"; do
              copy_one "$NAME"
            done
          fi
          (cd "$ASSETS" && sha256sum * > release-assets.sha256)
          jq -e --arg version "$VER" '.version == $version and (.platforms["darwin-aarch64"] != null)' "$ASSETS/latest.json" >/dev/null

      - name: render reviewed release body without write credentials
        env:
          TAG: ${{ needs.build.outputs.tag }}
          WINDOWS_RELEASE: ${{ vars.WINDOWS_RELEASE }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          cat > /tmp/automated-release-body.md <<NOTES_EOF
          Automated release from \`$GITHUB_SHA\`.

          **Verification:**

          Build provenance (SLSA-3):
          \`\`\`
          gh attestation verify Mark_${VER}_aarch64.dmg --owner xronocode
          \`\`\`

          Cosign keyless signature:
          \`\`\`
          cosign verify-blob --bundle Mark_${VER}_aarch64.dmg.bundle Mark_${VER}_aarch64.dmg
          \`\`\`

          DMG SHA-256, CycloneDX SBOMs, attribution notices, and the ed25519-signed updater feed are published as release assets.

          \`\`\`
          brew upgrade --cask mark
          \`\`\`
          NOTES_EOF
          if [ "$WINDOWS_RELEASE" = true ]; then
            printf '\n**Windows (x64):** NSIS installer `Mark_%s_x64-setup.exe` is included in the updater feed.\n' "$VER" >> /tmp/automated-release-body.md
          fi
          node tools/release-notes.mjs --tag "$TAG" --automated-body /tmp/automated-release-body.md > /tmp/release-body.md

      - name: seal publication bundle
        run: |
          set -euo pipefail
          (cd /tmp && sha256sum release-body.md release-assets/* > publication.sha256)

      - name: upload publication bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-publication-${{ needs.build.outputs.tag }}
          path: |
            /tmp/release-assets
            /tmp/release-body.md
            /tmp/publication.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish github release
    needs: [build, prepare-publication]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - name: download immutable publication bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-publication-${{ needs.build.outputs.tag }}
          path: /tmp/publication

      - name: verify publication bundle digest
        run: |
          set -euo pipefail
          cd /tmp/publication
          sha256sum -c publication.sha256

      - name: reconcile and verify draft or exact public release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          ASSETS=/tmp/publication/release-assets
          BODY=/tmp/publication/release-body.md
          ALREADY_PUBLISHED=false
          RELEASE_JSON=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId,isDraft 2>/dev/null || true)
          if [ -n "$RELEASE_JSON" ]; then
            RELEASE_ID=$(jq -r .databaseId <<<"$RELEASE_JSON")
            DRAFT=$(jq -r .isDraft <<<"$RELEASE_JSON")
            if [ "$DRAFT" = true ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$BODY"
            else
              ALREADY_PUBLISHED=true
            fi
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Mark $TAG" --notes-file "$BODY"
            RELEASE_ID=
            for ATTEMPT in 1 2 3 4 5; do
              RELEASE_ID=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId 2>/dev/null || true)
              [ -n "$RELEASE_ID" ] && break
              [ "$ATTEMPT" = 5 ] && { echo "::error::release draft was not readable after creation"; exit 1; }
              sleep $((ATTEMPT * 2))
            done
          fi
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          if [ "$ALREADY_PUBLISHED" = false ]; then
            for FILE in "$ASSETS"/*; do
              NAME=$(basename "$FILE")
              ASSET_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --paginate --jq ".[] | select(.name == \"$NAME\") | .id")
              if [ -n "$ASSET_ID" ]; then
                gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" > "/tmp/server-$NAME"
                cmp "$FILE" "/tmp/server-$NAME" || { echo "::error::existing draft asset differs: $NAME"; exit 1; }
              else
                gh release upload "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY"
              fi
            done
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > /tmp/release-readback.json
          jq -je '.body' /tmp/release-readback.json > /tmp/server-body.md
          cmp "$BODY" /tmp/server-body.md
          find "$ASSETS" -maxdepth 1 -type f -exec basename {} \; | sort > /tmp/expected-assets.txt
          jq -er '.assets[].name' /tmp/release-readback.json | sort > /tmp/server-assets.txt
          diff -u /tmp/expected-assets.txt /tmp/server-assets.txt
          mkdir /tmp/release-readback
          while read -r NAME; do
            # Same draft caveat: fetch each asset by its id from the
            # readback instead of gh release download's tag lookup.
            ASSET_URL=$(jq -r --arg name "$NAME" '.assets[] | select(.name == $name) | .url' /tmp/release-readback.json)
            [ -n "$ASSET_URL" ] || { echo "::error::asset missing from readback: $NAME"; exit 1; }
            gh api -H 'Accept: application/octet-stream' "$ASSET_URL" > "/tmp/release-readback/$NAME"
          done < /tmp/expected-assets.txt
          (cd /tmp/release-readback && sha256sum -c release-assets.sha256)
          cmp "$ASSETS/latest.json" /tmp/release-readback/latest.json
          echo "already_published=$ALREADY_PUBLISHED" >> "$GITHUB_OUTPUT"

      - name: publish verified draft as final mutation
        if: steps.draft.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName \
            | jq -e --arg tag "$TAG" 'select(.isDraft == false and .isPrerelease == false and .tagName == $tag)' >/dev/null

  close-release-please:
    name: close release please lifecycle
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: verify latest and close exact Release Please lifecycle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          for ATTEMPT in 1 2 3 4 5; do
            LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
            [ "$LATEST" = "$TAG" ] && break
            [ "$ATTEMPT" = 5 ] && { echo "::error::latest release feed did not advance to $TAG"; exit 1; }
            sleep $((ATTEMPT * 3))
          done
          VER="${TAG#v}"
          gh pr list --repo "$GITHUB_REPOSITORY" --state merged --base main --limit 100 \
            --json number,title,headRefName,headRefOid,headRepositoryOwner,mergeCommit,labels > /tmp/release-prs.json
          jq -e --arg title "chore(release): v$VER" \
            '[.[] | select(.title == $title and .headRefName == "release-please--branches--main--components--reborn-mark" and .headRepositoryOwner.login == "xronocode")] | length == 1' \
            /tmp/release-prs.json >/dev/null
          PR_NUMBER=$(jq -r --arg title "chore(release): v$VER" '.[] | select(.title == $title and .headRefName == "release-please--branches--main--components--reborn-mark") | .number' /tmp/release-prs.json)
          MERGE_SHA=$(jq -r --arg title "chore(release): v$VER" '.[] | select(.title == $title and .headRefName == "release-please--branches--main--components--reborn-mark") | .mergeCommit.oid' /tmp/release-prs.json)
          HEAD_SHA=$(jq -r --arg title "chore(release): v$VER" '.[] | select(.title == $title and .headRefName == "release-please--branches--main--components--reborn-mark") | .headRefOid' /tmp/release-prs.json)
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/compare/$MERGE_SHA...$TAG" \
            | jq -e 'select(.status == "ahead" or .status == "identical")' >/dev/null
          VERSION_AT_MERGE=$(gh api "repos/$GITHUB_REPOSITORY/contents/.release-please-manifest.json?ref=$MERGE_SHA" --jq .content | tr -d '\n' | base64 -d | jq -r '.["."]')
          [ "$VERSION_AT_MERGE" = "$VER" ]
          LABELS=$(jq -r --argjson number "$PR_NUMBER" '.[] | select(.number == $number) | [.labels[].name] | join("\n")' /tmp/release-prs.json)
          if grep -Fxq 'autorelease: tagged' <<<"$LABELS"; then
            exit 0
          fi
          grep -Fxq 'autorelease: pending' <<<"$LABELS"
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label 'autorelease: pending' --add-label 'autorelease: tagged'

  publish-cask:
    name: cross-repo cask PR
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-cask
    permissions:
      contents: read
    # B4 step-15: cross-repo PR via xronocode-release-bot GitHub App.
    # The App's installation token has contents:write on
    # xronocode/homebrew-mark and pull-requests:write to open the bump
    # PR. Missing credentials fail explicitly. While workflow artifacts
    # are retained, `gh run rerun --failed` retries this idempotent job
    # without retagging, rebuilding, or republishing the release.
    steps:
      - name: checkout reborn-mark
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/release-stage

      - name: gate on App secrets
        env:
          CASK_BOT_APP_ID: ${{ secrets.CASK_BOT_APP_ID }}
          CASK_BOT_PRIVATE_KEY: ${{ secrets.CASK_BOT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$CASK_BOT_APP_ID"
          test -n "$CASK_BOT_PRIVATE_KEY"

      - name: mint app installation token
        id: app_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          # Symbolic GitHub secret lookups only; credential bytes are stored in the release-cask Environment, never in source.
          app-id: ${{ secrets.CASK_BOT_APP_ID }}
          private-key: ${{ secrets.CASK_BOT_PRIVATE_KEY }}
          owner: xronocode
          repositories: homebrew-mark
          permission-contents: write
          permission-pull-requests: write

      - name: open cask bump PR
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"

          # Pull the .sha256 sidecar value (NOT recompute) per B2CR-3.
          SHA256_FILE=$(find /tmp/release-stage -name "Mark_${VER}_aarch64.dmg.sha256" | head -1)
          if [ -z "$SHA256_FILE" ]; then
            echo "::error::sha256 sidecar missing for $TAG"
            exit 1
          fi
          SHA256=$(awk '{print $1}' < "$SHA256_FILE")

          # Configure git to use the GH App token via gh's credential
          # helper. Without this, `git push` falls through to the default
          # askpass and fails: "could not read Username for github.com".
          gh auth setup-git

          # Clone tap, bump, push, open PR.
          gh repo clone xronocode/homebrew-mark /tmp/tap -- --depth 1
          cd /tmp/tap

          git config user.name 'xronocode-release-bot[bot]'
          git config user.email 'xronocode-release-bot[bot]@users.noreply.github.com'

          # Select cask file: alpha tags → mark@alpha.rb, stable → mark.rb
          if echo "$VER" | grep -q 'alpha'; then
            CASK="Casks/mark@alpha.rb"
            CASK_NAME="mark@alpha"
          else
            CASK="Casks/mark.rb"
            CASK_NAME="mark"
          fi

          BRANCH="bump/${CASK_NAME}-${VER}"
          TITLE="Bump ${CASK_NAME} to ${VER}"
          EXPECTED_CASK_PR_AUTHOR='app/xronocode-cask-bot'
          EXISTING=$(gh pr list --repo xronocode/homebrew-mark --state all --head "xronocode:$BRANCH" --json number,title,headRefName,baseRefName,state,isDraft,author --limit 2)
          COUNT=$(jq 'length' <<<"$EXISTING")
          if [ "$COUNT" = 1 ]; then
            jq -e --arg title "$TITLE" --arg branch "$BRANCH" --arg author "$EXPECTED_CASK_PR_AUTHOR" \
              '.[0] | select(.title == $title and .headRefName == $branch and .baseRefName == "main" and .isDraft == false and .author.login == $author)' \
              <<<"$EXISTING" >/dev/null
            PR_NUMBER=$(jq -r '.[0].number' <<<"$EXISTING")
            PR_STATE=$(jq -r '.[0].state' <<<"$EXISTING")
            if [ "$PR_STATE" = MERGED ]; then
              gh api "repos/xronocode/homebrew-mark/contents/$CASK?ref=main" \
                -H 'Accept: application/vnd.github.raw+json' > /tmp/cask-main.rb
              grep -Fxq "  version \"$VER\"" /tmp/cask-main.rb
              grep -Fxq "  sha256 \"$SHA256\"" /tmp/cask-main.rb
              echo "exact cask PR already merged for $TAG"
              exit 0
            fi
            [ "$PR_STATE" = OPEN ]
            echo "exact cask PR already open for $TAG"
          elif [ "$COUNT" = 0 ]; then
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
              echo "::error::cask branch exists without the exact PR"
              exit 1
            fi
            git checkout -b "$BRANCH"

            sed -i'' -e "s|version \".*\"|version \"$VER\"|" "$CASK"
            sed -i'' -e "s|sha256 \"[a-f0-9]*\"|sha256 \"$SHA256\"|" "$CASK"

            # The Tauri release contract publishes Mark_<version>_aarch64.dmg.
            EXPECTED_DMG_TEMPLATE='Mark_#{version}_aarch64.dmg'
            if ! grep -Fq "$EXPECTED_DMG_TEMPLATE" "$CASK"; then
              echo "::error::$CASK URL must reference $EXPECTED_DMG_TEMPLATE"
              exit 1
            fi

            git add "$CASK"
            git commit -m "$TITLE"
            git push origin "$BRANCH"

            PR_URL=$(gh pr create \
              --repo xronocode/homebrew-mark \
              --title "$TITLE" \
              --body "Auto-generated by release.yml on tag ${TAG}.

            - DMG sha256 sourced verbatim from Mark_${VER}_aarch64.dmg.sha256 sidecar.
            - SLSA-3 attestation + Cosign bundle published with the release.
            - Smoke launch + warnings allowlist passed in CI.

            The repository-owned cask/validate check must pass before automatic merge." \
              --base main \
              --head "$BRANCH")
            PR_NUMBER=$(gh pr view "$PR_URL" --repo xronocode/homebrew-mark --json number --jq .number)
          else
            echo "::error::ambiguous cask PR identity for $TAG"
            exit 1
          fi

          PR=$(gh pr view "$PR_NUMBER" --repo xronocode/homebrew-mark --json number,title,headRefName,baseRefName,state,isDraft,author)
          jq -e --arg title "$TITLE" --arg branch "$BRANCH" --arg author "$EXPECTED_CASK_PR_AUTHOR" \
            'select(.title == $title and .headRefName == $branch and .baseRefName == "main" and .state == "OPEN" and .isDraft == false and .author.login == $author)' \
            <<<"$PR" >/dev/null
          gh pr merge "$PR_NUMBER" --repo xronocode/homebrew-mark --auto --squash --delete-branch
