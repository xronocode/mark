# Dependabot version updates — keeps the lockfiles from drifting.
# Security updates are opened immediately regardless of this schedule.
#
# Ecosystems:
#   npm  /       — app + test tooling (root package-lock.json)
#   npm  /site   — marketing/docs site (separate lockfile)
#   cargo /      — Tauri workspace (Cargo.lock lives in the repo root)
#
# Grouping rule: patch and minor updates arrive as two separate groups per
# ecosystem, so a patch group can be merged on its own without waiting for a
# minor that still needs reading. Majors are never grouped: each one opens its
# own pull request with its own migration (codemirror 5 -> 6, vitest 4 -> 5 and
# jsdom 29 -> 30 are migrations, not bumps). A 0.x minor can also be breaking
# (notify-debouncer-full 0.5 -> 0.7 changed its API), so a 0.x bump is treated
# in its own pull request like a major.
#
# The appium stack is the calibrated iOS e2e toolchain (WDA session
# recycling, alert-bridge hooks); only patch/minor bumps are taken
# automatically, majors get a manual review pass first.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    groups:
      npm-root-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      npm-root-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
    ignore:
      # Pele is lockstep-managed (app + site ride one admitted minor
      # per train item, e.g. DEPS-PELE-1-10); group bumps would break
      # the lockstep.
      - dependency-name: "pele"
      # The e2e toolchain is pinned: a five-minor Playwright jump changed
      # composition timing and broke the IME characterization gate
      # (2026-11-01); bump it deliberately, with the gate re-validated.
      - dependency-name: "@playwright/test"
      - dependency-name: "appium*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@appium/*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "appium-xcuitest-driver"
        update-types:
          - "version-update:semver-minor"
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    groups:
      npm-site-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      npm-site-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /tools/stats-gateway
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    labels:
      - dependencies

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    groups:
      cargo-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      cargo-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
    labels:
      - dependencies
