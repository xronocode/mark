name: Feature request
description: Suggest an idea or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How you imagine it working. Sketches or examples from other tools are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
      description: Optional. Workarounds you use today.
