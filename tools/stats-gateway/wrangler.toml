# M-071 mt-stats-gateway — Cloudflare Worker route for the update-funnel
# counters (C-UPDATER-STATS). Deployed owner-side; see README.md.
#
# The gateway answers on exactly one host: workers_dev is disabled and the
# host updates.mark.xronocode.com is a Workers CUSTOM DOMAIN (provisioned
# 2026-11-02 — Cloudflare manages the DNS record and the certificate
# automatically; the xronocode.com zone lives in Cloudflare per C-22).
name = "mark-stats-gateway"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = false

routes = [
  { pattern = "updates.mark.xronocode.com", custom_domain = true }
]

[[analytics_engine_datasets]]
binding = "STATS"
dataset = "mark_update_funnel"
