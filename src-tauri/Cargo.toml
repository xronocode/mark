[package]
name = "mark"
description = "Mark — Tauri-based Markdown editor (Phase-B rewrite of xronocode/mark)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "mark"
path = "src/main.rs"

[features]
default = ["updater"]
updater = []
app-store = []  # local marker feature: gates sandbox-hostile code paths; MAS packaging is signing+entitlements, not a tauri cargo feature (v2.11)

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
notify-debouncer-full = "0.5"
ignore = "0.4"
regex = "1"
chardet = "0.2"
encoding_rs = "0.8"
clap = { version = "4", features = ["derive"] }
font-kit = "0.14"
keyring = "3"
tauri-plugin-updater = "2"  # non-optional: capabilities/default.json references updater:default, and tauri-build fails without the plugin in the tree even when the app-store cfg never registers it
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"  # C-15 T-W4: second launch ("Open With") forwards files to the running instance
reqwest = { version = "0.12", features = ["json"] }
# C-UPDATER-ROLLBACK M-068: rollback manager crypto/trash deps.
# minisign-verify is already in the lock transitively (tauri-plugin-updater)
# and is reused directly; sha2 likewise already-locked; trash is new.
minisign-verify = "0.2"
sha2 = "0.10"
trash = "5"
rand = "0.10"
tokio = { version = "1", features = ["sync", "rt", "time", "net", "macros"] }
axum = "0.8"
signal-hook = "0.4"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
core-foundation = "0.10"
core-foundation-sys = "0.8"

# C-38 T-007: Windows-only OS build probe for the Mica gate (m058).
# windows-version 0.1.7 is already in the root Cargo.lock (pulled by
# tao), so this adds no new lockfile entry.
# C-61: webview2-com 0.38 (already in the root lock via wry) is declared
# directly for the m052 print surface — ICoreWebView2_7::PrintToPdf and
# ICoreWebView2_16::ShowPrintUI. windows-core 0.61 (also already in the
# lock, webview2-com's own dependency) supplies Interface::cast/HSTRING.
# Both resolve to existing lock entries; no new crates.
[target.'cfg(target_os = "windows")'.dependencies]
windows-version = "0.100"
webview2-com = "0.38"
windows-core = "0.61"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
